name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - docker-support
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing tags if already present"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  build-cpu:
    name: Build CPU image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" && -n "$DOCKERHUB_USERNAME" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DOCKERHUB_TOKEN" || -n "$DOCKERHUB_USERNAME" ]]; then
            echo "Docker Hub username and token must be configured together" >&2
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Classify release tag (CPU)
        id: release-kind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$ ]]; then
              echo "Release tag has an unsupported format: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            echo "release_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata (CPU)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/lindkvis/pixlstash
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.release-kind.outputs.release_tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.release-kind.outputs.is_stable != 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.release-kind.outputs.is_stable == 'true' }}
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=sha,format=short

      - name: Compute tags to push (CPU)
        id: push-tags-cpu
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite || false }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$OVERWRITE_EXISTING" == "true" ]]; then
            { echo "tags<<EOF"; echo "$ALL_TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAGS_TO_PUSH=""
          while IFS= read -r TAG; do
            [[ -z "$TAG" ]] && continue
            if ! docker manifest inspect "$TAG" > /dev/null 2>&1; then
              echo "Will push: $TAG"
              TAGS_TO_PUSH+="${TAG}"$'\n'
            else
              echo "Skipping (already exists): $TAG"
            fi
          done <<< "$ALL_TAGS"
          { echo "tags<<EOF"; printf '%s' "$TAGS_TO_PUSH"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push CPU image
        if: steps.push-tags-cpu.outputs.tags != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.push-tags-cpu.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,scope=cpu,mode=max

  build-gpu:
    name: Build GPU image (NVIDIA CUDA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" && -n "$DOCKERHUB_USERNAME" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DOCKERHUB_TOKEN" || -n "$DOCKERHUB_USERNAME" ]]; then
            echo "Docker Hub username and token must be configured together" >&2
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Classify release tag (GPU)
        id: release-kind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$ ]]; then
              echo "Release tag has an unsupported format: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            echo "release_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata (GPU)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/lindkvis/pixlstash
          tags: |
            type=semver,pattern={{version}}-gpu
            type=semver,pattern={{major}}.{{minor}}-gpu
            type=raw,value=${{ steps.release-kind.outputs.release_tag }}-gpu,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.release-kind.outputs.is_stable != 'true' }}
            type=raw,value=latest-gpu,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.release-kind.outputs.is_stable == 'true' }}
            type=raw,value=edge-gpu,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short,suffix=-gpu

      - name: Compute tags to push (GPU)
        id: push-tags-gpu
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite || false }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$OVERWRITE_EXISTING" == "true" ]]; then
            { echo "tags<<EOF"; echo "$ALL_TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAGS_TO_PUSH=""
          while IFS= read -r TAG; do
            [[ -z "$TAG" ]] && continue
            if ! docker manifest inspect "$TAG" > /dev/null 2>&1; then
              echo "Will push: $TAG"
              TAGS_TO_PUSH+="${TAG}"$'\n'
            else
              echo "Skipping (already exists): $TAG"
            fi
          done <<< "$ALL_TAGS"
          { echo "tags<<EOF"; printf '%s' "$TAGS_TO_PUSH"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push GPU image
        if: steps.push-tags-gpu.outputs.tags != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ steps.push-tags-gpu.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,scope=gpu,mode=max
