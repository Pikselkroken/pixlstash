name: Refresh ComfyUI workflow templates

# Rebuilds pixlstash/data/workflow_templates.json and the graphs beside it from
# the latest comfyui-workflow-templates-json release (#1999), and opens or
# updates ONE pull request against develop on a fixed branch when the output
# changed. Nothing changed: no PR. Last week's PR still open: it is updated,
# not joined by a second. The app never fetches the list; this is the only
# thing that refreshes it.
#
# Untrusted input is the package's content (PyPI's JSON and the wheel). It is
# read by the Python script only: no step interpolates it into a shell, and the
# PR body is a file the script writes (body-path), not an expression.

permissions: {}

on:
  workflow_dispatch:
  schedule:
    # 06:41 UTC every Monday: off the hour, and after the ROCm check's slot.
    - cron: '41 6 * * 1'

concurrency:
  group: template-suggestions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The downloads' timeouts are per read, not in total.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Standard library only: no install step, so no dependency runs here.
      - name: Rebuild the template list
        env:
          SUMMARY: ${{ runner.temp }}/template-summary.md
        run: python scripts/build_template_suggestions.py --summary "$SUMMARY"

      # The bot token, as release-version.yml uses it: a PR opened with
      # GITHUB_TOKEN would not trigger the gate.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          base: develop
          branch: bot/workflow-templates
          commit-message: "Refresh ComfyUI workflow templates"
          title: "Refresh ComfyUI workflow templates"
          body-path: ${{ runner.temp }}/template-summary.md
          add-paths: |
            pixlstash/data/workflow_templates.json
            pixlstash/data/workflow_templates_index.json
            pixlstash/data/workflow_templates
          delete-branch: true
