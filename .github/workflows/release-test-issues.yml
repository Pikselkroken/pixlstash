name: Create release test issues

# Fires automatically on the first release candidate tag, e.g. v1.7.0rc1.
# Tags use PEP 440 (no hyphen: v1.5.0rc1, v1.6.0rc5), so the previous 'v*-rc1'
# glob never matched and this workflow never auto-fired.
# Can also be triggered manually for any tag (e.g. a special rc4 re-run)
on:
  push:
    tags:
      - 'v*rc1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use as the release version label (e.g. v1.7.0rc4)'
        required: true

permissions: {}

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$ ]]; then
            echo "Release tag has an unsupported format: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure release-testing label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "release-testing" \
            --description "Tracks manual release test checklist issues" \
            --color "0075ca" \
            --force

      - name: Create one issue per test-plan section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess

          tag = os.environ["TAG"]
          plan_path = "docs/release-test-plan.md"

          with open(plan_path) as f:
              text = f.read()

          # Split on level-2 headings; keep the heading with its content
          parts = re.split(r'^(## .+)$', text, flags=re.MULTILINE)

          # parts is: [preamble, heading, body, heading, body, ...]
          sections = []
          for i in range(1, len(parts) - 1, 2):
              heading = parts[i].strip()          # e.g. "## 3. Configuration"
              body    = parts[i + 1].strip()

              # Skip non-test sections
              title_text = heading.lstrip('#').strip()
              if title_text.lower().startswith('how to use'):
                  continue
              if title_text.lower().startswith('changelog'):
                  continue

              sections.append((title_text, body))

          for title, body in sections:
              issue_title = f"[{tag}] Release test: {title}"
              issue_body  = (
                  f"Release test checklist for **{tag}**.\n\n"
                  f"Source: [`docs/release-test-plan.md`](../blob/main/docs/release-test-plan.md)\n\n"
                  f"---\n\n"
                  f"{body}"
              )

              subprocess.run(
                  [
                      "gh", "issue", "create",
                      "--title", issue_title,
                      "--body",  issue_body,
                      "--label", "release-testing",
                  ],
                  check=True,
              )
              print(f"Created issue: {issue_title}")

          print(f"Done — {len(sections)} issues created.")
          PYEOF
