name: AI Review

# PR-Agent (https://github.com/The-PR-Agent/pr-agent) reviewing through
# OpenRouter. Needs the OPENROUTER_API_KEY secret; the model is the
# OPENROUTER_MODEL repository variable (an OpenRouter slug such as
# `z-ai/glm-5.3-flash`), defaulting to that when unset.
#
# Reviews automatically only when the review owner (REVIEW_OWNER_ID) is the one
# acting: opening a PR, pushing to one (their own or a contributor's fork PR), or marking
# it ready. A contributor's push triggers nothing, so the key is never spent on
# input the owner has not seen; the owner re-runs it by commenting a PR-Agent
# command (`/review`, `/improve`, `/ask ...`). Comment commands always run the
# default branch's copy of this file.
#
# pull_request_target, NOT pull_request: under `pull_request` a fork PR gets no
# secrets, so contributor PRs could never be reviewed, and the workflow judging
# the PR would be the PR's own copy of this file. `pull_request_target` also runs
# the default branch's copy (main), whatever the PR targets, so nothing here is
# live until it reaches main. That is only safe because nothing here checks
# out or executes PR code -- PR-Agent reads the diff through the API. Do not add
# a checkout step here.

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  # Pushes to one PR supersede each other; each comment gets its own group, so
  # nobody else's comment can cancel the owner's queued command.
  group: ai-review-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  # The account id, not the login: a renamed login can be registered by anyone.
  REVIEW_OWNER_ID: "1160606"

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shared by both PR-Agent steps. The secrets stay on the steps that need them.
    env:
      # Pinned here because env overrides win over any .pr_agent.toml, which
      # could otherwise point the key at another host.
      OPENROUTER.API_BASE: https://openrouter.ai/api/v1
      # Without a cap a looping generation runs until the job timeout: OpenRouter
      # keeps the connection alive, so ai_timeout never fires. Reasoning tokens count
      # against it, and PR-Agent subtracts it from MAX_MODEL_TOKENS for the diff.
      OPENROUTER.MAX_TOKENS: "40000"
      OPENROUTER.REASONING_EFFORT: "medium"
      CONFIG.MODEL: openrouter/${{ vars.OPENROUTER_MODEL || 'z-ai/glm-5.3-flash' }}
      # The upstream default fallback is an OpenAI model we hold no key for.
      CONFIG.FALLBACK_MODELS: "[]"
      # Required for models missing from PR-Agent's token table; each step's
      # CONFIG.MAX_MODEL_TOKENS is what we actually send.
      CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
      GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
      GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
      GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
      # The review rules, read from main for review and improve alike.
      CONFIG.REPO_CONTEXT_FILES: '[".github/review-context.md"]'
    steps:
      - name: Decide whether this PR is reviewed
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const ownerId = Number(process.env.REVIEW_OWNER_ID);
            const is = (user) => user?.id === ownerId;
            // /improve runs in its own step with a smaller chunk budget; every
            // other command runs in the review step.
            const decide = (run, why, command = "") => {
              core.info(why);
              const improve = command === "/improve";
              core.setOutput("review", String(run && !improve));
              core.setOutput("improve", String(run && (improve || !command)));
            };

            if (context.eventName === "issue_comment") {
              const { issue, comment } = context.payload;
              if (!issue.pull_request) return decide(false, "Comment is not on a PR.");
              if (!is(comment.user)) return decide(false, "Commenter is not the review owner.");
              if (!comment.body.trimStart().startsWith("/")) return decide(false, "Comment is not a command.");
              const command = comment.body.trim().split(/\s+/)[0];
              return decide(true, "Review owner issued a command.", command);
            }

            const pr = context.payload.pull_request;
            if (pr.draft) return decide(false, "PR is a draft.");
            // The sender is whoever pushed, opened or reopened, not the PR author.
            // A same-repo head on someone else's PR (anyone can open develop ->
            // main) makes the owner the sender of every push to that branch, so
            // only a fork head, which the owner must push to deliberately, counts.
            const forkHead = pr.head.repo?.id !== pr.base.repo.id;
            if (is(context.payload.sender) && (is(pr.user) || forkHead)) {
              return decide(true, "Review owner triggered this event.");
            }
            decide(false, "Someone other than the review owner triggered this; comment a command to review it.");

      # /review and /improve need different diff budgets, and PR-Agent has one
      # setting for both (CONFIG.MAX_MODEL_TOKENS), so each gets its own step.
      - name: PR-Agent review
        if: steps.gate.outputs.review == 'true'
        # Digest of the pragent/pr-agent:0.46.0-github_action image.
        uses: docker://pragent/pr-agent@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # /review never chunks: the whole diff must fit in one call.
          CONFIG.MAX_MODEL_TOKENS: "160000"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'

      - name: PR-Agent improve
        if: steps.gate.outputs.improve == 'true'
        uses: docker://pragent/pr-agent@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # /improve splits the diff into chunks of MAX_MODEL_TOKENS minus the
          # output cap: 89000 - 64000 keeps ~25k of diff per chunk. One ~54k-token
          # chunk made the model reason until the cap and return nothing.
          CONFIG.MAX_MODEL_TOKENS: "89000"
          # ~25k-token chunks reason for up to ~37k tokens, and now and then one
          # runs past 40000 and returns nothing (finish_reason: length), so
          # /improve gets more room than /review needs.
          OPENROUTER.MAX_TOKENS: "64000"
          # Measure chunks with line numbers already added. Without it PR-Agent
          # sizes the chunks bare, adds line numbers afterwards and clips the
          # overflow, silently dropping ~30% of a large diff.
          PR_CODE_SUGGESTIONS.DECOUPLE_HUNKS: "true"
          # Enough calls for ~250k tokens of diff; files past the last call are
          # not reviewed.
          PR_CODE_SUGGESTIONS.MAX_NUMBER_OF_CALLS: "10"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/improve"]'
          # /improve posts each suggestion as an inline, committable review comment
          # instead of one summary table.
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"
