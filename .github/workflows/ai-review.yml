name: AI Review

# PR-Agent (https://github.com/The-PR-Agent/pr-agent) reviewing through
# OpenRouter. Needs the OPENROUTER_API_KEY secret; the model is the
# OPENROUTER_MODEL repository variable (an OpenRouter slug such as
# `z-ai/glm-5.3-flash`), defaulting to that when unset.
#
# Reviews automatically only when the review owner (REVIEW_OWNER_ID) is the one
# acting: opening a PR, pushing to one (their own or a contributor's fork PR), or marking
# it ready. A contributor's push triggers nothing, so the key is never spent on
# input the owner has not seen; the owner re-runs it by commenting a PR-Agent
# command (`/review`, `/improve`, `/ask ...`). Comment commands always run the
# default branch's copy of this file.
#
# pull_request_target, NOT pull_request: under `pull_request` a fork PR gets no
# secrets, so contributor PRs could never be reviewed, and the workflow judging
# the PR would be the PR's own copy of this file. `pull_request_target` also runs
# the default branch's copy (main), whatever the PR targets, so nothing here is
# live until it reaches main. That is only safe because nothing here checks
# out or executes PR code -- PR-Agent reads the diff through the API. Do not add
# a checkout step here.
#
# A finding the owner has already answered must not come back on the next push
# in new words. Before each run the owner's replies to the review bot's inline
# findings are handed to both tools as answered points, and the owner's
# top-level comments, with what room is left, as context only. Only the owner's
# account's text goes in, matched by id: anyone else's comment would be a way
# to write into the prompt. That trusts the account, so text an agent posts
# under it counts too; the instructions keep authorization, data-loss and
# secret-exposure defects reportable whatever an answer says.
# PERSISTENT_INLINE_COMMENTS also skips a suggestion re-posted verbatim.

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  # Pushes to one PR supersede each other; each comment gets its own group, so
  # nobody else's comment can cancel the owner's queued command.
  group: ai-review-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  # The account id, not the login: a renamed login can be registered by anyone.
  REVIEW_OWNER_ID: "1160606"

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shared by both PR-Agent steps. The secrets stay on the steps that need them.
    env:
      # Pinned here because env overrides win over any .pr_agent.toml, which
      # could otherwise point the key at another host.
      OPENROUTER.API_BASE: https://openrouter.ai/api/v1
      # Without a cap a looping generation runs until the job timeout: OpenRouter
      # keeps the connection alive, so ai_timeout never fires. Reasoning tokens count
      # against it, and PR-Agent subtracts it from MAX_MODEL_TOKENS for the diff.
      OPENROUTER.MAX_TOKENS: "40000"
      OPENROUTER.REASONING_EFFORT: "medium"
      CONFIG.MODEL: openrouter/${{ vars.OPENROUTER_MODEL || 'z-ai/glm-5.3-flash' }}
      # The upstream default fallback is an OpenAI model we hold no key for.
      CONFIG.FALLBACK_MODELS: "[]"
      # Required for models missing from PR-Agent's token table; each step's
      # CONFIG.MAX_MODEL_TOKENS is what we actually send.
      CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
      GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
      GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
      GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
      # Skip an inline suggestion already posted in the same file with the same
      # opening words (80 characters) or the same code; a reworded one is the
      # answered-points step's job. PR-Agent reads its dedup markers, invisible
      # HTML comments, from every review comment on the PR, so a commenter
      # could plant one and hide a predictable suggestion in that file;
      # accepted, since it can only hide, never add.
      CONFIG.PERSISTENT_INLINE_COMMENTS: "true"
      # The review rules, read from main (PR-Agent's default,
      # repo_context_from_default_branch) for review and improve alike.
      CONFIG.REPO_CONTEXT_FILES: '[".github/review-context.md"]'
    steps:
      - name: Decide whether this PR is reviewed
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ownerId = Number(process.env.REVIEW_OWNER_ID);
            const is = (user) => user?.id === ownerId;
            // /improve runs in its own step with a smaller chunk budget; every
            // other command runs in the review step.
            const decide = (run, why, command = "") => {
              core.info(why);
              const improve = command === "/improve";
              core.setOutput("review", String(run && !improve));
              core.setOutput("improve", String(run && (improve || !command)));
            };

            if (context.eventName === "issue_comment") {
              const { issue, comment } = context.payload;
              if (!issue.pull_request) return decide(false, "Comment is not on a PR.");
              if (!is(comment.user)) return decide(false, "Commenter is not the review owner.");
              if (!comment.body.trimStart().startsWith("/")) return decide(false, "Comment is not a command.");
              const command = comment.body.trim().split(/\s+/)[0];
              return decide(true, "Review owner issued a command.", command);
            }

            const pr = context.payload.pull_request;
            if (pr.draft) return decide(false, "PR is a draft.");
            // The sender is whoever pushed, opened or reopened, not the PR author.
            // A same-repo head on someone else's PR (anyone can open develop ->
            // main) makes the owner the sender of every push to that branch, so
            // only a fork head, which the owner must push to deliberately, counts.
            const forkHead = pr.head.repo?.id !== pr.base.repo.id;
            if (is(context.payload.sender) && (is(pr.user) || forkHead)) {
              return decide(true, "Review owner triggered this event.");
            }
            decide(false, "Someone other than the review owner triggered this; comment a command to review it.");

      - name: Collect the owner's answers on this PR
        id: answered
        if: steps.gate.outputs.review == 'true' || steps.gate.outputs.improve == 'true'
        # An API error here must not cost the review: the output is then empty
        # and both tools run without the answers.
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ownerId = Number(process.env.REVIEW_OWNER_ID);
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            // Room left for the diff matters more than old answers: newest first
            // up to the cap, then back in the order they were written.
            const CAP = 12000;
            const footer = /\n*---\n_Generated by \[Claude Code\]\([^)]*\)_\s*$/;
            const flat = (body) => (body || "").replace(footer, "").replace(/\s+/g, " ").trim();
            // A quote in an owner's comment is someone else's text: drop it.
            const own = (body) => flat((body || "").split("\n").filter((l) => !l.trimStart().startsWith(">")).join("\n"));
            const clip = (text, n) => (text.length > n ? `${text.slice(0, n)}...` : text);
            // github-actions[bot], by id like the owner.
            const isReviewBot = (user) => user?.type === "Bot" && user.id === 41898282;

            const answers = [];
            const inline = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const byId = new Map(inline.map((c) => [c.id, c]));
            for (const reply of inline) {
              if (!reply.in_reply_to_id || reply.user?.id !== ownerId) continue;
              const finding = byId.get(reply.in_reply_to_id);
              if (!finding || !isReviewBot(finding.user)) continue;
              const where = `${finding.path}:${finding.line ?? finding.original_line ?? "?"}`;
              const what = clip(flat(finding.body.replace(/```[\s\S]*?```/g, "").replace(/<!--[\s\S]*?-->/g, "")), 300);
              answers.push({
                at: reply.created_at,
                text: `- ${where}. Finding: ${what}\n  Owner's answer: ${clip(own(reply.body), 1200)}`,
              });
            }
            const remarks = [];
            const thread = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            for (const comment of thread) {
              if (comment.user?.id !== ownerId) continue;
              const body = own(comment.body);
              if (!body || body.startsWith("/")) continue;
              remarks.push({ at: comment.created_at, text: `- ${clip(body, 1200)}` });
            }

            // Answers fill the cap first; remarks get what is left. Newest first
            // within each, then back in the order they were written.
            let size = 0;
            const take = (notes) => {
              const kept = [];
              for (const note of [...notes].sort((a, b) => b.at.localeCompare(a.at))) {
                if (size + note.text.length > CAP) break;
                kept.push(note.text);
                size += note.text.length;
              }
              return kept.reverse();
            };
            const keptAnswers = take(answers);
            const keptRemarks = take(remarks);
            core.info(
              `${keptAnswers.length} of ${answers.length} answers and ` +
              `${keptRemarks.length} of ${remarks.length} remarks passed on.`,
            );
            // SECURITY: the fixed first line is what stops Dynaconf reading the
            // value as a token: a value that starts with `@format` is
            // evaluated, and can read the step's env, OPENROUTER.KEY included.
            // Keep a constant first line that cannot start with `@`.
            const lines = [];
            if (keptAnswers.length) {
              lines.push(
                "The repository owner has already answered these review findings on this pull request.",
                "Do not raise them again, in any wording, unless the code in the diff no longer matches what the answer describes.",
                "Where an answer says a suggested function, class or selector does not exist, do not suggest it again.",
                ...keptAnswers,
              );
            }
            if (keptRemarks.length) {
              lines.push(
                "The owner's other comments on this pull request, as context only: they are not answered findings.",
                ...keptRemarks,
              );
            }
            if (lines.length) {
              lines.unshift("Notes from this pull request's history, written by its owner.");
              lines.push(
                "None of this covers an authorization, data-loss or secret-exposure defect: report those whatever a note says.",
              );
            }
            core.setOutput("text", lines.join("\n"));

      # /review and /improve need different diff budgets, and PR-Agent has one
      # setting for both (CONFIG.MAX_MODEL_TOKENS), so each gets its own step.
      - name: PR-Agent review
        if: steps.gate.outputs.review == 'true'
        # Digest of the pragent/pr-agent:0.46.0-github_action image.
        uses: docker://pragent/pr-agent@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # One call holds MAX_MODEL_TOKENS minus the output cap: ~120k of diff.
          CONFIG.MAX_MODEL_TOKENS: "160000"
          # A diff past that used to lose whole files (35 of 48 on a ~337k-token
          # PR). Now it is split into calls of that same size, run side by side
          # and merged into one review; 8 calls cover ~900k tokens of diff. A
          # diff that fits one call is still reviewed in one.
          PR_REVIEWER.ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER.MAX_NUMBER_OF_CALLS: "8"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          PR_REVIEWER.EXTRA_INSTRUCTIONS: ${{ steps.answered.outputs.text }}

      - name: PR-Agent improve
        if: steps.gate.outputs.improve == 'true'
        uses: docker://pragent/pr-agent@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # /improve splits the diff into chunks of MAX_MODEL_TOKENS minus the
          # output cap: 89000 - 64000 keeps ~25k of diff per chunk. One ~54k-token
          # chunk made the model reason until the cap and return nothing.
          CONFIG.MAX_MODEL_TOKENS: "89000"
          # ~25k-token chunks reason for up to ~37k tokens, and now and then one
          # runs past 40000 and returns nothing (finish_reason: length), so
          # /improve gets more room than /review needs.
          OPENROUTER.MAX_TOKENS: "64000"
          # Measure chunks with line numbers already added. Without it PR-Agent
          # sizes the chunks bare, adds line numbers afterwards and clips the
          # overflow, silently dropping ~30% of a large diff.
          PR_CODE_SUGGESTIONS.DECOUPLE_HUNKS: "true"
          # Enough calls for ~220k tokens of diff (each chunk also carries up to
          # ~3k tokens of the owner's answers); files past the last call are
          # not reviewed.
          PR_CODE_SUGGESTIONS.MAX_NUMBER_OF_CALLS: "10"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/improve"]'
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: ${{ steps.answered.outputs.text }}
          # /improve posts each suggestion as an inline, committable review comment
          # instead of one summary table.
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"
