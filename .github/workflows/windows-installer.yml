name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: read-only by default; only the job that attaches release
# assets gets contents: write (and the release itself uses RELEASE_BOT_TOKEN).
permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # npm ci runs third-party dependency lifecycle scripts; this job needs
          # no git credentials once the tree is on disk.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(d['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $isPrerelease = python -c "from packaging.version import Version; v=Version('$version'); print('true' if v.is_prerelease else 'false')"
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v${{ steps.version.outputs.version }}"
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match pyproject version $expected"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          PIXLSTASH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\PixlStash.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixlstash-server-windows-${{ steps.version.outputs.version }}
          path: installer/windows/installer-output/*.exe

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Publish with a PAT, not the default GITHUB_TOKEN. Releases created by
          # GITHUB_TOKEN do not emit a `release: published` event that can trigger
          # other workflows, which is why release-version.yml (docs + latest-version)
          # never ran for tag-pushed releases. A PAT-created release does trigger it.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: installer/windows/installer-output/*.exe
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
