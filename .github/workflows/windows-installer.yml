name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: every job uses a read-only GITHUB_TOKEN. Release uploads use
# RELEASE_BOT_TOKEN only in the action step that attaches each artifact.
permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # npm ci runs third-party dependency lifecycle scripts; this job needs
          # no git credentials once the tree is on disk.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(d['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $isPrerelease = python -c "from packaging.version import Version; v=Version('$version'); print('true' if v.is_prerelease else 'false')"
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $expected = "v$env:EXPECTED_VERSION"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$') {
            Write-Error "Release tag has an unsupported format: $tag"
          }
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match pyproject version $expected"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          PIXLSTASH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\PixlStash.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixlstash-server-windows-${{ steps.version.outputs.version }}
          path: installer/windows/installer-output/*.exe

  # Windows Authenticode signing (Certum SimplySign) — same design as the
  # sign-windows-desktop job in electron.yml: the cloud key is only reachable
  # through Certum's SimplySign Desktop GUI, so signing runs on Linux in the
  # prebuilt certum-signer container (see .github/actions/certum-sign/ and
  # docs/windows-signing-setup.md). The sign job — not the build job — attaches
  # the installer to the release, with a PAT (RELEASE_BOT_TOKEN), not
  # GITHUB_TOKEN: releases created by GITHUB_TOKEN do not emit a
  # `release: published` event, which release-version.yml depends on.
  sign-windows-server:
    # SimplySign allows ONE session per account, so the desktop and server
    # sign jobs must never run at once (a tag push starts both workflows
    # together; the second login displaces the first and its PKCS#11 token
    # never activates). This group is shared by BOTH workflows: keep the name
    # identical in electron.yml and windows-installer.yml. Never cancel — a
    # queued sign job must wait, not be dropped, or a release ships unsigned.
    concurrency:
      group: certum-simplysign-session
      cancel-in-progress: false
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: windows-signing
    container:
      # UPDATE THIS DIGEST from the "Build Certum Signer Image" workflow's step
      # summary after an image change (docs/windows-signing-setup.md §rollout).
      image: ghcr.io/pikselkroken/certum-signer@sha256:00a9d37f35d787cb584014cb95e964326018e0c92a59d1b687129c36295febb6 # built by run 30620372480 from 6bb21307
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pixlstash-server-windows-${{ needs.build-installer.outputs.version }}
          path: signing
      - name: Sign installer
        uses: ./.github/actions/certum-sign
        env:
          CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
        with:
          files: "signing/*.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixlstash-server-windows-${{ needs.build-installer.outputs.version }}-signed
          path: signing/*.exe
      - name: Upload signing diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signing-diagnostics-server
          path: |
            ${{ runner.temp }}/simplysign-redacted.log
            ${{ runner.temp }}/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Attach signed installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: signing/*.exe
          prerelease: ${{ needs.build-installer.outputs.is_prerelease == 'true' }}

  # Fallback while signing is not enabled: ship the installer with an explicit
  # -unsigned suffix (mirrors the desktop app's convention in electron.yml).
  # Gated on the variable being EMPTY, not merely != 'true': a malformed value
  # ('True', '1') then attaches no Windows exe at all — loud — instead of
  # silently shipping unsigned while the operator believes signing is on.
  attach-windows-server-unsigned:
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pixlstash-server-windows-${{ needs.build-installer.outputs.version }}
          path: signing
      - name: Label installer as unsigned
        run: |
          set -euo pipefail
          for f in signing/*.exe; do mv "$f" "${f%.exe}-unsigned.exe"; done
          ls signing/
          echo "::warning title=Unsigned Windows build::Certum code signing is not enabled (WINDOWS_SIGNING_ENABLED repo variable / windows-signing environment secrets). Attaching the Windows installer with an '-unsigned' suffix — SmartScreen will warn users. See docs/windows-signing-setup.md."
      - name: Attach unsigned installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # PAT, not GITHUB_TOKEN — see the comment on sign-windows-server.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: signing/*.exe
          prerelease: ${{ needs.build-installer.outputs.is_prerelease == 'true' }}
