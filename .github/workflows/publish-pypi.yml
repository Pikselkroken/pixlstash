name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip packaging
          [ "$RELEASE_REF" = "refs/tags/$RELEASE_TAG" ] || {
            echo "::error::Ref '$RELEASE_REF' is not an allowed release tag" >&2
            exit 1
          }
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          python scripts/check_release_tag.py "$RELEASE_TAG" "$version"
          echo "Tag/version check passed: $RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: python -m build

      - name: Verify wheel includes Alembic assets
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import sys
          import zipfile

          wheel_paths = sorted(glob.glob('dist/pixlstash-*.whl'))
          if not wheel_paths:
            print('No wheel found in dist/.')
            sys.exit(1)

          wheel = pathlib.Path(wheel_paths[-1])
          required = [
            'pixlstash/alembic.ini',
            'pixlstash/migrations/env.py',
            'pixlstash/migrations/script.py.mako',
            'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
            print('Missing required files in wheel:')
            for name in missing:
              print(f' - {name}')
            sys.exit(1)

          print(f'Wheel Alembic asset check passed: {wheel}')
          PY

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
