name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild with this workflow (e.g. v1.13.2). Run from main; see rebuild-release.yml."
        required: false
        type: string

permissions: {}

env:
  # The source to build: the release_tag input on a rebuild (see
  # rebuild-release.yml), else '' (checkout's default, the triggering ref).
  SOURCE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
          # The wheel carries the ComfyUI-PixlStash nodes (a public submodule).
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject version
        env:
          REBUILD_TAG: ${{ inputs.release_tag }}
          DISPATCH_REF: ${{ github.ref }}
          RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # A rebuild runs main's workflow, so it must be dispatched from main.
          if [ -n "$REBUILD_TAG" ] && [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::release_tag rebuilds must be dispatched from main, not $DISPATCH_REF" >&2
            exit 1
          fi
          python -m pip install --upgrade pip packaging
          [ "$RELEASE_REF" = "refs/tags/$RELEASE_TAG" ] || {
            echo "::error::Ref '$RELEASE_REF' is not an allowed release tag" >&2
            exit 1
          }
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          python scripts/check_release_tag.py "$RELEASE_TAG" "$version"
          echo "Tag/version check passed: $RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        env:
          # Fail rather than ship a wheel without the ComfyUI-PixlStash nodes.
          PIXLSTASH_REQUIRE_COMFYUI_PACK: "1"
        run: python -m build

      - name: Verify wheel includes Alembic assets
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import sys
          import zipfile

          wheel_paths = sorted(glob.glob('dist/pixlstash-*.whl'))
          if not wheel_paths:
            print('No wheel found in dist/.')
            sys.exit(1)

          wheel = pathlib.Path(wheel_paths[-1])
          required = [
            'pixlstash/alembic.ini',
            'pixlstash/migrations/env.py',
            'pixlstash/migrations/script.py.mako',
            'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
            print('Missing required files in wheel:')
            for name in missing:
              print(f' - {name}')
            sys.exit(1)

          print(f'Wheel Alembic asset check passed: {wheel}')
          PY

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A rebuild produces new bytes for files PyPI already holds, and PyPI
          # never accepts a filename twice: skip those, upload only what is
          # missing. A first publish from a tag push still fails on a clash.
          skip-existing: ${{ inputs.release_tag != '' }}
