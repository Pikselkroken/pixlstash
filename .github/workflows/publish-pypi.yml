name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          release_ref = os.environ["RELEASE_REF"]
          tag = os.environ["RELEASE_TAG"]
          tag_pattern = re.compile(
              r"^v[0-9]+\.[0-9]+\.[0-9]+"
              r"(?:(?:a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$"
          )
          if release_ref != f"refs/tags/{tag}" or not tag_pattern.fullmatch(tag):
              print(f"::error::Ref {release_ref!r} is not an allowed release tag")
              sys.exit(1)

          pyproject = pathlib.Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
          expected = f"v{data['project']['version']}"
          if tag != expected:
              print(f"::error::Tag {tag} does not match project version {expected}")
              sys.exit(1)

          print(f"Tag/version check passed: {tag}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: python -m build

      - name: Verify wheel includes Alembic assets
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import sys
          import zipfile

          wheel_paths = sorted(glob.glob('dist/pixlstash-*.whl'))
          if not wheel_paths:
            print('No wheel found in dist/.')
            sys.exit(1)

          wheel = pathlib.Path(wheel_paths[-1])
          required = [
            'pixlstash/alembic.ini',
            'pixlstash/migrations/env.py',
            'pixlstash/migrations/script.py.mako',
            'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
            print('Missing required files in wheel:')
            for name in missing:
              print(f' - {name}')
            sys.exit(1)

          print(f'Wheel Alembic asset check passed: {wheel}')
          PY

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
