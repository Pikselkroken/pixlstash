          tests/test_hub_bootstrap.py
          tests/test_hub_engine.py
          tests/test_hub_model_shelf_schema.py
          tests/test_hub_registry.py
          tests/test_identity_storage_guardrail.py
          tests/test_image_embedding_worker.py
