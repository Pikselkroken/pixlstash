
name: CI

permissions:
  contents: read

# A superseded run has nothing left to prove, and its runners are exactly what
# the replacement run queues behind. Cancel them on feature branches; keep every
# run on the protected branches so the record of what was green on main/develop
# stays complete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# `push:` used to be unfiltered, so every commit on a PR branch started the
# workflow twice — once for the push and once for the pull_request — running
# the same tests on the same SHA. That was ~2x waste when CI was three jobs;
# with the sharded matrix below it is the difference between fitting in the
# account's 20-concurrent-job budget and queueing behind a redundant copy of
# yourself. PR branches are covered by `pull_request`; the branches that get
# pushed to without a PR (protected, release-prep) and release tags are listed
# explicitly.
on:
  push:
    branches:
      - main
      - develop
      - 'release-**'
      - 'rc-prep-**'
    tags:
      - 'v*'
  pull_request:
  # Lets release-prep force the informational full-suite sweep on demand (the
  # single-process sweep job below keys off this event).
  workflow_dispatch:

env:
  # Shared pytest flags for every backend job.
  #
  # Verbosity is deliberately lower than the local command documented in
  # CLAUDE.md (`-s -vvv --log-cli-level=INFO`). `-s` disables capture, so every
  # INFO line of a ~900-test suite is streamed into the Actions log: slow to
  # write, slow to fetch, and unreadable. Capture stays ON here and the level
  # stays at INFO, so a *failing* test still reports its full captured log —
  # the debugging signal is unchanged, only the noise from passing tests is
  # gone. `-ra` lists every non-passing outcome in the trailing summary.
  PYTEST_FLAGS: -q -ra --log-level=INFO --fast-captions --force-cpu

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, high-signal checks. Deliberately has no HF_TOKEN: it runs no pytest
  # step, so it needs no HuggingFace downloads, and the token is kept to the
  # jobs that actually do.
  # ---------------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Verify wheel includes Alembic assets
        run: |
          set -e
          python -m pip wheel . --no-deps -w /tmp/pixlstash-wheelcheck
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob('/tmp/pixlstash-wheelcheck/pixlstash-*.whl'))[-1]
          required = [
              'pixlstash/alembic.ini',
              'pixlstash/migrations/env.py',
              'pixlstash/migrations/script.py.mako',
              'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
              print('Missing required files in wheel:')
              for name in missing:
                  print(f' - {name}')
              sys.exit(1)

          print('Wheel Alembic asset check passed.')
          PY

      - name: Check formatting with ruff
        run: |
          ruff check pixlstash

      - name: Check backend_architecture.md is up to date
        run: |
          python scripts/render_backend_architecture.py --check

      - name: Test Frontend Utilities
        run: |
          cd frontend
          npm ci
          npm test

  # ---------------------------------------------------------------------------
  # The backend gate. Split across 8 runners instead of one job with 22
  # sequential steps.
  #
  # The list below is the GATED set. The ~52 files that are not in it are not
  # forgotten — they are declared as DEFERRED in tests/test_ci_shards.py, and
  # that test fails if any file under tests/ is in neither list. Adding a test
  # file therefore forces an explicit decision: gate it, or record why it is
  # deferred. That is the property that matters, because the old design had no
  # such forcing function — a new file was gated only if whoever added it also
  # remembered to edit this workflow, and PR #588 is a live example of one that
  # did not.
  #
  # The seven behavioural authz/fail-closed suites — test_authz_gate_step3,
  # test_authz_gate_step4, test_authz_host_capability_16_3,
  # test_ip_locality_fail_closed, test_pictures_stream, test_scrapheap_retention
  # and test_async_import_staging — are gated here and MUST stay gated. Policy
  # *declaration* completeness has always blocked every PR
  # (test_architecture_guardrails.py::test_all_routes_declare_access_policy);
  # these are the other half, the ones that prove the AuthzGate actually
  # ENFORCES what it declares. While they were deferred their only run was the
  # non-blocking release-prep sweep, and a broken assertion in one of them sat
  # undetected for five days. tests/test_ci_shards.py::
  # test_security_suites_cannot_be_quietly_deferred fails if any of them is
  # removed from this list or parked back in DEFERRED_FROM_GATE.
  #
  # Cost of gating them, measured rather than assumed (2026-07-26): the seven
  # files are 151 tests in 182 s wall clock on a machine calibrated against this
  # runner (gate shard 6/8 = 238 s locally vs 257 s in CI, so ~1.08x). That is
  # ~3.3 min of extra test time spread over 8 shards — roughly +25 s per shard,
  # not the ~20 min the block was previously assumed to cost. Gate wall clock
  # goes from ~13 min to ~13.5 min. This does NOT approach the widened
  # release-prep budget, and it must not: regular PRs stay fast.
  #
  # Why the rest of the deferred set is not simply gated too: it is not yet
  # known green, and some of it is not deterministic. Measured 2026-07-26,
  # tests/test_smart_score_invalidation.py returns a DIFFERENT pass count
  # depending on machine load — 41 passed on an idle tree, 4 failed under two
  # concurrent workloads — because its assertions race an async invalidation
  # that has not landed yet (the failures read `assert <float> is None`).
  # Collection order is deterministic (no randomising plugin), so load is the
  # variable. Do not record a specific failure count for that file, and do not
  # gate it on a loaded runner, which is its failing condition. Most of the
  # rest have simply never run as a blocking check. Gating them today would
  # turn every PR red. The flip to full discovery (`pytest tests/`, no list at
  # all) is a follow-up, blocked on getting the deferred set green AND on
  # making the load-sensitive ones deterministic — the informational sweep
  # below keeps it
  # visible in the meantime.
  #
  # `--ci-shard i/N` (implemented in tests/conftest.py) deals the collected
  # tests round-robin, so each file's tests are spread evenly and no single slow
  # file becomes one shard's critical path — splitting by *test* rather than by
  # file is what breaks up the authz suites and the 6-minute test_server.py.
  # Measured with the authz files gated: 684 tests deal out 85-86 per shard,
  # with the 151 authz tests landing 18-20 per shard, so no shard absorbs the
  # block. tests/test_ci_shards.py asserts the matrix below and the `/N` in the
  # command agree.
  #
  # Parallelism is deliberately across runners only, NOT pytest-xdist inside a
  # runner. xdist is installed (and is a good local `-n auto`), but two attempts
  # to validate the ML-heavy half of the suite under `-n auto` ended with every
  # worker aborting during teardown — "terminate called without an active
  # exception", a C++ thread-pool destructor firing while onnxruntime/torch
  # state was being released in conftest's pytest_sessionfinish. That is a
  # crash with no failing test attached to it, which is the worst kind of CI
  # flake to debug. Sharding across jobs buys the same wall clock with one
  # single-threaded pytest per runner and no new native-teardown concurrency.
  # Revisit `-n 2` only with a green measured run behind it.
  # ---------------------------------------------------------------------------
  backend:
    name: backend shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard must report: one shard failing tells you nothing about the
      # other seven, and a partial picture costs another full round trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # HF_TOKEN lifts HuggingFace's anonymous-download rate limit, which was
    # throttling cold model fetches past the import tests' 10s timeout. Use a
    # READ-ONLY, public-scope fine-grained token: that minimal scope is the
    # compensating control for exposing it job-wide. Set job-wide rather than
    # per-step so a newly added pytest step can't silently reintroduce the
    # flake. Absent on fork PRs by design — GitHub withholds secrets from
    # forked-PR runs, which fall back to unauthenticated downloads. Do NOT
    # switch those to pull_request_target.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Backend tests (shard ${{ matrix.shard }} of 8)
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/8"
          tests/test_anomaly_region_scope.py
          tests/test_architecture_guardrails.py
          tests/test_async_import_staging.py
          tests/test_authentication.py
          tests/test_authz_gate_step3.py
          tests/test_authz_gate_step4.py
          tests/test_authz_host_capability_16_3.py
          tests/test_backend_order_stability.py
          tests/test_batch_character_likeness_scope.py
          tests/test_ci_shards.py
          tests/test_clip_text_embedding_similarity.py
          tests/test_comfyui_api_prompt_extraction.py
          tests/test_comfyui_recipe_preflight.py
          tests/test_comfyui_recipe_route.py
          tests/test_comfyui_workflow_extraction.py
          tests/test_dedup_sweep_api.py
          tests/test_dedup_sweep_service.py
          tests/test_detections_scope.py
          tests/test_facial_features_worker.py
          tests/test_find_orphaned_files.py
          tests/test_florence.py
          tests/test_florence_model_variant.py
          tests/test_image_embedding_worker.py
          tests/test_impossible_clear_authz.py
          tests/test_invalid_image_endless_retry.py
          tests/test_ip_locality_fail_closed.py
          tests/test_label_ledger.py
          tests/test_likeness_worker.py
          tests/test_many_to_many_face_data.py
          tests/test_metadata_hash.py
          tests/test_migrations.py
          tests/test_multi_project_membership_authz.py
          tests/test_openapi_response_schemas.py
          tests/test_operation_log.py
          tests/test_picture_mutation_scope.py
          tests/test_picture_plugins.py
          tests/test_picture_set_locking.py
          tests/test_picture_sets.py
          tests/test_picture_stack_utils.py
          tests/test_pictures_stream.py
          tests/test_rate_limiter.py
          tests/test_read_token_security.py
          tests/test_restore.py
          tests/test_score_agreement_stats.py
          tests/test_scope_table.py
          tests/test_scrapheap_retention.py
          tests/test_server.py
          tests/test_smart_score_consistency.py
          tests/test_snapshots.py
          tests/test_snapshots_auth.py
          tests/test_ssl_generation.py
          tests/test_tag_prediction_scope.py
          tests/test_tag_worker.py
          tests/test_vram_batch_budget.py
          tests/test_watch_folder_worker.py
          tests/test_websocket_auth.py
          tests/test_work_planner.py

  # ---------------------------------------------------------------------------
  # RELEASE-PREP ONLY — informational ordering sweep, sharded by contiguous
  # block.
  #
  # This job's value is the ORDER, not coverage: the gate deals its tests
  # round-robin, which is exactly the thing that could hide (or cause) an
  # order- or shard-dependence. This job is the control for that.
  #
  # Note it is ALSO the only run for the files in DEFERRED_FROM_GATE
  # (tests/test_ci_shards.py) — a substantial slice of tests/. Those are
  # therefore covered only here, only during release prep, and only
  # informationally. That is a known gap, not a design goal: an earlier version
  # of this comment claimed "the whole suite now blocks on every run", which was
  # never true and contradicted the deferral list in the same tree. The
  # behavioural authz/fail-closed suites used to be in that gap and are now
  # gated; prefer moving the remaining files onto the gate over relying on this
  # sweep. It keeps the `continue-on-error` semantics — a red here is a triage
  # signal, not a gate failure — and the release-prep trigger.
  #
  # It used to be one process running `pytest tests/` end to end: the perfect
  # control, at ~40-50 min, on the critical path of every release prep. It is
  # now split across a matrix, which necessarily weakens the control, so the
  # split was chosen to give up as little of it as possible:
  #
  #  * `--ci-block-shard i/N` (tests/conftest.py) gives shard i the i-th
  #    CONTIGUOUS slice of the canonical collection order. Relative order is
  #    preserved inside every shard, so any order dependence between two tests
  #    still fails unless the pair happens to straddle one of the N-1 block
  #    boundaries. Weaker than one process; far stronger than round-robin.
  #  * NOT `--ci-shard`. Reusing the gate's round-robin here would shard the
  #    shard-dependence detector with the same dealing algorithm it exists to
  #    audit — the one arrangement guaranteed to prove nothing.
  #  * Not "contiguous blocks of whole files" either. It preserves a little
  #    more (boundaries always land between files), but it cannot split a slow
  #    single file such as the 6-min test_server.py, so the slowest shard would
  #    still be most of the wall clock. Test-level blocks lose at most N-1
  #    adjacency points to buy a real split. (This bullet used to cite a
  #    "~20-min authz block" as the other example; the seven behavioural authz
  #    files were measured at 182 s total on 2026-07-26 and are now gated, so
  #    test_server.py is the real case.)
  #  * Not "keep one full-order job, but only on refs/tags/v*". That preserves
  #    the control perfectly and loses it exactly where it is wanted: an
  #    ordering bug found at tag time is found after the release candidate has
  #    already been signed off, and it puts a 50-min serial job on the tag
  #    build's critical path.
  #
  # N=6, not 8. Two reasons, and the second is the binding one. (1) Concurrency:
  # this workflow alone already queues 14 jobs (checks 1 + backend 8 + e2e 1 +
  # backend_windows 4) against the account's 20-concurrent-job budget, so 6 is
  # what fits without the sweep queueing behind the gate it is supposed to run
  # alongside. (2) Diminishing returns: the fixed per-runner cost here (disk
  # reclaim + pip install + HuggingFace cache restore) is ~10 min and does not
  # shard, so past ~6 shards each extra runner buys a minute or two of test
  # time and pays a full setup for it. Expected wall clock ~16-20 min: ~10 min
  # setup plus the slowest block. Blocks are equal in test COUNT, not in test
  # TIME — that imbalance is the price of preserving order, and it is why this
  # lands near the 8-shard gate's 13-16 min rather than below it.
  #
  # The per-shard check name is NOT stable across a resize, by design: this job
  # is informational and must never be a required check. Branch protection
  # requires `build` (below), which aggregates it.
  #
  # The old "1.7.0 headline API surface" step is gone: its five files
  # (test_tag_health_api, test_reviews_api, test_tag_predictions_api,
  # test_tag_suggestions_api, test_tagger_runs_api) are now collected and
  # blocking on every run, which is strictly stronger than blocking only during
  # release prep.
  # ---------------------------------------------------------------------------
  backend_release_sweep:
    name: backend-full block ${{ matrix.shard }} (informational, release-prep only)
    if: startsWith(github.head_ref || github.ref_name, 'rc-prep') || startsWith(github.head_ref || github.ref_name, 'release') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # Every block must report, for the same reason as the gate: one red block
      # says nothing about the other five, and release prep cannot afford
      # another full round trip to find out.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # See the `backend` job for the rationale and the read-only token requirement.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Full suite in collection order (block ${{ matrix.shard }} of 6)
        continue-on-error: true
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-block-shard "$CI_SHARD/6"
          tests/

  # ---------------------------------------------------------------------------
  # Aggregate status for the Linux side. Exists so branch protection can require
  # one stable check name instead of a per-shard list that would have to be
  # re-configured every time the matrix is resized.
  # ---------------------------------------------------------------------------
  build:
    name: build
    if: always()
    needs: [checks, backend, backend_release_sweep]
    runs-on: ubuntu-latest
    steps:
      # Each dependency is checked against what IT is allowed to report, not
      # against a shared allowlist. `skipped` is a pass only for
      # backend_release_sweep, which is skipped outside release prep by design.
      # For checks/backend, `skipped` must fail: if someone later adds a
      # `paths:` or `if:` filter to the gate, this check would otherwise go
      # green having run zero tests — a required check that passes by not
      # running is worse than no required check at all. (CSO condition F2.)
      #
      # `backend` and `backend_release_sweep` are both matrices, and
      # `needs.<job>.result` collapses a matrix into ONE value: `skipped` only
      # if every leg was skipped, `failure` if ANY leg failed, `cancelled` if
      # any was cancelled and none failed, `success` otherwise. So the checks
      # below already cover partial failure, and they keep working when a
      # matrix is resized — which is the whole point of aggregating here
      # instead of listing per-shard check names in branch protection.
      #
      # A `failure` from the sweep is still fatal here even though the sweep is
      # "informational": its pytest step carries `continue-on-error`, so a
      # failing TEST cannot produce one. A failing JOB therefore means
      # checkout/setup died and the ordering control did not run at all, which
      # during release prep is exactly what must not pass silently.
      - name: Require the blocking backend jobs to have succeeded
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          SWEEP_RESULT: ${{ needs.backend_release_sweep.result }}
        run: |
          set -euo pipefail
          echo "checks=$CHECKS_RESULT backend=$BACKEND_RESULT sweep=$SWEEP_RESULT"

          failed=0
          for job in checks backend; do
            case "$job" in
              checks) result="$CHECKS_RESULT" ;;
              backend) result="$BACKEND_RESULT" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "::error::Blocking job '$job' reported '$result' (must be 'success')."
              failed=1
            fi
          done

          case "$SWEEP_RESULT" in
            success|skipped) ;;
            *)
              echo "::error::backend_release_sweep reported '$SWEEP_RESULT'."
              failed=1
              ;;
          esac

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All required backend jobs passed."

  e2e:
    # Playwright UI tests drive the real SPA against a backend booted on a
    # throwaway copy of the committed test-data/ fixture (browse-only: workers
    # disabled, no ML models needed). Skips cleanly until the fixture is
    # committed, so CI stays green in the meantime.
    runs-on: ubuntu-latest
    steps:
      - name: Remove unused tools
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v6

      - name: Detect e2e fixture
        id: fixture
        run: |
          if [ -f test-data/images/vault.db ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::test-data/ fixture not committed — skipping Playwright e2e."
          fi

      - name: Set up Python
        if: steps.fixture.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        if: steps.fixture.outputs.present == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-

      - name: Install backend
        if: steps.fixture.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Set up Node
        if: steps.fixture.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and Chromium
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright report
        if: ${{ always() && steps.fixture.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows only validates OS-sensitive behaviour (file/path/process handling,
  # DB file swap, server startup, image libs). The ML-inference tests are
  # OS-independent — PyTorch/CLIP/InsightFace behave the same on Windows — so
  # they run on Linux only to keep this job fast. That subset is therefore a
  # deliberate scope choice, not a gate, which is why this job keeps an explicit
  # file list while the Linux gate does not: the completeness guarantee lives on
  # Linux, and a file missing here costs Windows-specific breadth, not coverage.
  #
  # The list is sharded with the same `--ci-shard` mechanism, without xdist:
  # `test_server.py` alone was 13 min of the 30, and splitting by test (rather
  # than by file) is what actually breaks that up. Job-level sharding adds no
  # intra-process concurrency, so it introduces no new flake surface on the
  # platform that is hardest to debug remotely.
  # ---------------------------------------------------------------------------
  backend_windows:
    name: backend-windows shard ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # See the `backend` job for the rationale and the read-only token requirement.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # The wheel build (pip install . below) runs `npm ci` via setup.py. Set up
      # Node with an npm cache so that step pulls tarballs from the warm cache
      # instead of cold over the network on every run — the main source of the
      # ECONNRESET flake here. Matches electron.yml / windows-installer.yml.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,dev]

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          # See the Linux setup-backend action for the rationale. The taggers
          # download via hf_hub_download(local_dir=...) into platformdirs'
          # Windows user_data_dir —
          # %LOCALAPPDATA%\pixlstash\pixlstash\downloaded_models (the doubled
          # "pixlstash" is platformdirs' appauthor=appname default) — NOT
          # ~\.cache\huggingface. Caching both is what makes a warm runner skip
          # the HEAD revalidation that returns the 429.
          path: |
            ~\.cache\huggingface
            ~\AppData\Local\pixlstash\pixlstash\downloaded_models
          key: hf-models-${{ runner.os }}-${{ hashFiles('pixlstash/tagger_plugins/wd14.py', 'pixlstash/tagger_plugins/pixlstash_tagger.py', 'pixlstash/tagger_plugins/florence2.py') }}
          restore-keys: hf-models-${{ runner.os }}-

      - name: OS-sensitive backend tests (shard ${{ matrix.shard }} of 4)
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/4"
          tests/test_migrations.py
          tests/test_snapshots.py
          tests/test_restore.py
          tests/test_snapshots_auth.py
          tests/test_metadata_hash.py
          tests/test_architecture_guardrails.py
          tests/test_multi_project_membership_authz.py
          tests/test_openapi_response_schemas.py
          tests/test_find_orphaned_files.py
          tests/test_server.py
          tests/test_authentication.py
          tests/test_rate_limiter.py
          tests/test_picture_sets.py
          tests/test_picture_stack_utils.py
          tests/test_picture_plugins.py
          tests/test_comfyui_api_prompt_extraction.py
          tests/test_comfyui_recipe_preflight.py
          tests/test_comfyui_recipe_route.py
          tests/test_comfyui_workflow_extraction.py
          tests/test_watch_folder_worker.py
          tests/test_work_planner.py

  # Aggregate status for Windows, for the same branch-protection reason as
  # `build`.
  build-windows:
    name: build-windows
    if: always()
    needs: [backend_windows]
    runs-on: ubuntu-latest
    steps:
      # `success` only — `skipped` must fail here for the same reason as in
      # `build`: this is a blocking gate, so a filter that stopped the shards
      # from running must not leave a green required check behind. (CSO
      # condition F2.)
      - name: Require every Windows shard to have succeeded
        env:
          RESULT: ${{ needs.backend_windows.result }}
        run: |
          set -euo pipefail
          echo "backend-windows result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::backend-windows reported '$RESULT' (must be 'success')."
            exit 1
          fi
          echo "Windows shards passed."
