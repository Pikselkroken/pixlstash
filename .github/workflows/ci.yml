
name: CI

permissions:
  contents: read

# A superseded run has nothing left to prove, and its runners are exactly what
# the replacement run queues behind. Cancel them on feature branches; keep every
# run on the protected branches so the record of what was green on main/develop
# stays complete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# `push:` used to be unfiltered, so every commit on a PR branch started the
# workflow twice — once for the push and once for the pull_request — running
# the same tests on the same SHA. That was ~2x waste when CI was three jobs;
# with the sharded matrix below it doubles the run's whole 14-job footprint
# against the concurrency budget, to queue behind a redundant copy of
# yourself. PR branches are covered by `pull_request`; the branches that get
# pushed to without a PR (protected, release-prep) and release tags are listed
# explicitly.
on:
  push:
    branches:
      - main
      - develop
      - 'release-**'
      - 'rc-prep-**'
    tags:
      - 'v*'
  pull_request:
  # Lets release-prep force the informational full-suite sweep on demand (the
  # single-process sweep job below keys off this event).
  workflow_dispatch:

env:
  # Shared pytest flags for every backend job.
  #
  # Verbosity is deliberately lower than the local command documented in
  # CLAUDE.md (`-s -vvv --log-cli-level=INFO`). `-s` disables capture, so every
  # INFO line of a ~900-test suite is streamed into the Actions log: slow to
  # write, slow to fetch, and unreadable. Capture stays ON here and the level
  # stays at INFO, so a *failing* test still reports its full captured log —
  # the debugging signal is unchanged, only the noise from passing tests is
  # gone. `-ra` lists every non-passing outcome in the trailing summary.
  #
  # `--durations=0 --durations-min=0` is the data source for the time-balanced
  # `--ci-shard` deal (tests/conftest.py). It reports every test's setup/call/
  # teardown time, which `scripts/record_test_durations.py` turns back into the
  # committed tests/ci_test_durations.json. `--durations-min=0` (rather than
  # pytest's 0.005 s default) is what makes the map COMPLETE: a test omitted
  # for being fast would be indistinguishable from a test that is new, and the
  # sharder charges an unknown test the median cost, which for a 2 ms test is
  # wrong by two orders of magnitude. The price is ~3 extra log lines per test.
  # This changes no test's behaviour and adds no runtime — it only prints.
  PYTEST_FLAGS: >-
    -q -ra --log-level=INFO --fast-captions --force-cpu
    --durations=0 --durations-min=0

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, high-signal checks. Deliberately has no HF_TOKEN: it runs no pytest
  # step, so it needs no HuggingFace downloads, and the token is kept to the
  # jobs that actually do.
  # ---------------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Verify wheel includes Alembic assets
        run: |
          set -e
          python -m pip wheel . --no-deps -w /tmp/pixlstash-wheelcheck
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob('/tmp/pixlstash-wheelcheck/pixlstash-*.whl'))[-1]
          required = [
              'pixlstash/alembic.ini',
              'pixlstash/migrations/env.py',
              'pixlstash/migrations/script.py.mako',
              'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
              print('Missing required files in wheel:')
              for name in missing:
                  print(f' - {name}')
              sys.exit(1)

          print('Wheel Alembic asset check passed.')
          PY

      - name: Check formatting with ruff
        run: |
          ruff check pixlstash

      - name: Check backend_architecture.md is up to date
        run: |
          python scripts/render_backend_architecture.py --check

      - name: Test Frontend Utilities
        run: |
          cd frontend
          npm ci
          npm test

      # `npm run lint` is `tsc --noEmit`. `npm test` compiles with
      # tsconfig.test.json, which only covers src/ + test/; the lint pass is
      # what type-checks the main-process build as electron-builder will.
      - name: Test Electron shell
        working-directory: electron
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install telemetry Worker dependencies
        working-directory: website/telemetry-worker
        run: npm ci

      - name: Test telemetry Worker
        working-directory: website/telemetry-worker
        run: npm test

      - name: Validate telemetry Worker config and D1 binding
        working-directory: website/telemetry-worker
        run: npm run check:config

  # ---------------------------------------------------------------------------
  # The single writer of the HuggingFace model cache. Every other job restores
  # it read-only (see .github/actions/setup-backend).
  #
  # Why a job and not a step in the shards: `actions/cache` writes only on a key
  # MISS, so a model missing from an entry that keeps hitting its primary key can
  # never be added to it. CLIP was missing from the 1.77 GB entry for exactly
  # that reason, so all eight shards re-fetched ~600 MB of weights on every run
  # until HuggingFace 429'd `backend shard 8` (run 31304213276). Adding the
  # missing files to the key alone would not fix it: the first run after a bust
  # would have eight runners cold-downloading the same weights at the same
  # moment, which is the same stampede. One job downloads the set once, and the
  # eight shards then start against a cache that is complete by construction.
  #
  # Cost to the blocking gate: this sits in front of the shards, so it is pure
  # critical path. On the normal warm path that is only checkout + a cache
  # restore (~1 min) — the Python install is skipped, because nothing needs to
  # be downloaded. The shards get that back by no longer downloading models.
  #
  # restore + explicit save, rather than `actions/cache`, so the write happens
  # ONLY when the prefetch succeeded. An auto-save post-step runs even after a
  # failed step, which would freeze a half-downloaded model set under the
  # primary key and recreate the bug this job exists to fix.
  # ---------------------------------------------------------------------------
  warm_models:
    name: warm model cache
    runs-on: ubuntu-latest
    # See the `backend` job for the rationale and the read-only token
    # requirement. Absent on fork PRs by design; the prefetch then runs
    # anonymously, which one sequential job is far more likely to survive than
    # eight parallel ones were.
    # Only a `push` can save this cache (see the save step), so only a `push`
    # runs the prefetch — and a run that never fetches has no use for the
    # token. Scoping it this way keeps the secret out of the environment on
    # pull-request runs, which are the ones that execute the PR's own tree via
    # `pip install .`. The shards below still carry it unconditionally: they
    # reach HuggingFace during the tests themselves.
    env:
      HF_TOKEN: ${{ github.event_name == 'push' && secrets.HF_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - id: models
        uses: ./.github/actions/model-cache

      # Only needed to run the prefetch, so it is skipped whenever the cache is
      # already complete — which is every run that does not change the model set.
      - if: steps.models.outputs.hit != 'true' && github.event_name == 'push'
        uses: ./.github/actions/setup-backend

      - name: Download every model the gate loads
        if: steps.models.outputs.hit != 'true' && github.event_name == 'push'
        run: python scripts/prefetch_ci_models.py

      # Saved only from a BRANCH run, never from a pull request.
      #
      # A cache written by a `pull_request` run lands in refs/pull/N/merge and
      # is deleted with the PR, so it can never warm anything but itself — while
      # still counting against the repo's 10 GB budget for as long as the PR is
      # open. Four open PRs were holding three 1.7 GB Windows entries and a
      # duplicate 1.7 GB Linux one, with the repo at ~9 GB of 10, which is how a
      # branch-scoped entry gets LRU-evicted and the whole scheme quietly stops
      # working.
      #
      # A PR that changes the model set is therefore not fully cold: the
      # `restore-keys` prefix restores the previous set and only the delta is
      # fetched, which is what that fallback is for.
      - name: Save the model cache
        if: >-
          success() && steps.models.outputs.hit != 'true'
          && github.event_name == 'push'
        uses: ./.github/actions/model-cache
        with:
          mode: save
          key: ${{ steps.models.outputs.key }}

  # ---------------------------------------------------------------------------
  # The backend gate. Split across 8 runners instead of one job with 22
  # sequential steps.
  #
  # Eight, restored 2026-08-09 when the org moved to the GitHub Team plan and
  # the concurrency cap went from 20 concurrent jobs to 60. This number went
  # 8 -> 4 -> 8, and the middle step was correct while it stood: under a
  # 20-slot cap the budget bound ACROSS RUNS, not within one. Measured on
  # 2026-08-05 between 16:09 and 18:35, seven CI runs were in flight
  # simultaneously at 17:47; at the then-current 17 jobs per run that is ~119
  # jobs demanded against 20 slots. The cap was directly observable in run
  # 30981632678 (tag v1.9.0rc1): exactly 20 jobs started at +0-4 min and the
  # 21st, `backend shard 1`, waited 8.2 min for a slot. In run 30981629822
  # every one of the 14 test jobs was created at 06:40:28 and started between
  # 06:48:14 and 06:57:20 — an 8-17 min queue before any test ran. The same
  # saturation showed up at the other end: the trivial `build` aggregator
  # queued 13m 00s in run 31031336234 and `build-windows` 16m 47s in run
  # 31023904354. Cutting to four shards bought those slots back, at the cost of
  # wall clock on every uncontended run.
  #
  # At 60 slots that trade is gone, so the lever goes back to seconds-per-test.
  # Fourteen jobs per run leaves room for ~4 concurrent PR runs, which is what
  # this repo routinely has in flight, so eight shards can now actually spend
  # the parallelism they ask for. Each still pays its own setup-backend
  # (free-disk-space + setup-python + pip install + HuggingFace cache restore),
  # now under a minute since #796 switched the install to CPU-only torch, so
  # that fixed cost is bought out of idle capacity rather than out of the next
  # PR's slots.
  #
  # Measured basis for the resize: at four shards, 193 s setup + 2652 s pytest
  # = 45.5 min per shard, ~177 min of backend test compute per run. At eight
  # that is ~22.1 min of tests per shard. LPT over the committed map splits the
  # recorded load dead level at N=8 (679 s per shard, max/min 1.000), and the
  # balance guardrail
  # (test_ci_shards.py::test_recorded_durations_actually_balance_the_gate)
  # reads N from this matrix, so a future resize has to re-prove that rather
  # than inherit the claim. If the concurrency budget ever tightens again this
  # is still the cheapest number here to tune, and 6 is the middle setting.
  #
  # The durable fix is not the shard count, but it is not the worker fleet
  # either, which is where this comment used to point. Measured 2026-08-09, the
  # ML worker fleet costs 0.05 s per Server boot (0.46 s with it against 0.41 s
  # without), so rolling `disable_background_workers` across the suite is worth
  # ~36 s out of 5432 s. Models load lazily through `ensure_ready` in
  # pixlstash/vault.py, which only the lifespan calls, so booting a Server does
  # not load them. The real cost is that 68 of the 89 Server-using test files
  # rebuild the whole environment INSIDE each test body instead of once in a
  # shared fixture; tests/test_authentication.py shows the fixed pattern at
  # 0.43 s/test. Move those onto shared fixtures and both the shard count and
  # its wall clock stop mattering.
  #
  # The list below is the GATED set. The ~52 files that are not in it are not
  # forgotten — they are declared as DEFERRED in tests/test_ci_shards.py, and
  # that test fails if any file under tests/ is in neither list. Adding a test
  # file therefore forces an explicit decision: gate it, or record why it is
  # deferred. That is the property that matters, because the old design had no
  # such forcing function — a new file was gated only if whoever added it also
  # remembered to edit this workflow, and PR #588 is a live example of one that
  # did not.
  #
  # The seven behavioural authz/fail-closed suites — test_authz_gate_step3,
  # test_authz_gate_step4, test_authz_host_capability_16_3,
  # test_ip_locality_fail_closed, test_pictures_stream, test_scrapheap_retention
  # and test_async_import_staging — are gated here and MUST stay gated. Policy
  # *declaration* completeness has always blocked every PR
  # (test_architecture_guardrails.py::test_all_routes_declare_access_policy);
  # these are the other half, the ones that prove the AuthzGate actually
  # ENFORCES what it declares. While they were deferred their only run was the
  # non-blocking release-prep sweep, and a broken assertion in one of them sat
  # undetected for five days. tests/test_ci_shards.py::
  # test_security_suites_cannot_be_quietly_deferred fails if any of them is
  # removed from this list or parked back in DEFERRED_FROM_GATE.
  #
  # Cost of gating them, measured rather than assumed (2026-07-26): the seven
  # files are 151 tests in 182 s wall clock on a machine calibrated against this
  # runner (gate shard 6/8 = 238 s locally vs 257 s in CI, so ~1.08x). That is
  # ~3.3 min of extra test time; spread over the eight shards below it is
  # roughly +25 s per shard, not the ~20 min the block was previously assumed
  # to cost. This does NOT approach the widened release-prep budget, and it
  # must not: regular PRs stay fast.
  #
  # Why the rest of the deferred set is not simply gated too: it is not yet
  # known green, and some of it is not deterministic. Measured 2026-07-26,
  # tests/test_smart_score_invalidation.py returns a DIFFERENT pass count
  # depending on machine load — 41 passed on an idle tree, 4 failed under two
  # concurrent workloads — because its assertions race an async invalidation
  # that has not landed yet (the failures read `assert <float> is None`).
  # Collection order is deterministic (no randomising plugin), so load is the
  # variable. Do not record a specific failure count for that file, and do not
  # gate it on a loaded runner, which is its failing condition. Most of the
  # rest have simply never run as a blocking check. Gating them today would
  # turn every PR red. The flip to full discovery (`pytest tests/`, no list at
  # all) is a follow-up, blocked on getting the deferred set green AND on
  # making the load-sensitive ones deterministic — the informational sweep
  # below keeps it
  # visible in the meantime.
  #
  # `--ci-shard i/N` (implemented in tests/conftest.py) splits by *test* rather
  # than by file, which is what breaks up the authz suites and the 6-minute
  # test_server.py, and it balances the shards by RECORDED TIME
  # (longest-processing-time-first over the committed
  # tests/ci_test_durations.json). It used to deal round-robin by position:
  # that equalises test count perfectly and test time not at all, and the
  # measured result on run 30925279472 was 744 s to 1205 s across eight
  # positionally dealt shards — a 1.62x spread, with the gate waiting on shard
  # 7 while shard 6 had been idle for ~460 s. LPT over the committed map closes
  # that: max/min is 1.000 at the eight shards below, and the guardrail holds
  # any assignment under 1.05.
  #
  # The durations map is committed rather than cached because all eight shards
  # must compute the SAME partition without communicating; see the module
  # docstring of scripts/record_test_durations.py, which also regenerates it.
  # A test missing from the map keeps its old round-robin position and a
  # missing or corrupt map degrades the whole deal back to round-robin, so
  # stale data costs wall clock and never coverage.
  # tests/test_ci_shards.py asserts the matrix below and the `/N` in the
  # command agree, and that the split stays an exact partition under all of
  # those degraded inputs.
  #
  # Parallelism is deliberately across runners only, NOT pytest-xdist inside a
  # runner. xdist is installed (and is a good local `-n auto`), but two attempts
  # to validate the ML-heavy half of the suite under `-n auto` ended with every
  # worker aborting during teardown — "terminate called without an active
  # exception", a C++ thread-pool destructor firing while onnxruntime/torch
  # state was being released in conftest's pytest_sessionfinish. That is a
  # crash with no failing test attached to it, which is the worst kind of CI
  # flake to debug. Sharding across jobs buys the same wall clock with one
  # single-threaded pytest per runner and no new native-teardown concurrency.
  # Revisit `-n 2` only with a green measured run behind it.
  # ---------------------------------------------------------------------------
  # The Windows half of the same scheme, as a SEPARATE job rather than a matrix
  # leg of `warm_models`: `backend` does `needs: warm_models`, and `needs:` on a
  # matrix job waits for every leg, so a matrix would put a Windows runner on
  # the Linux gate's critical path for nothing.
  #
  # Nothing was writing a Windows entry to a branch scope before this. The four
  # `backend_windows` shards each carried an inline read/write `actions/cache`,
  # which on a `pull_request` run writes into refs/pull/N/merge — a scope that
  # dies with the PR. Every PR therefore paid four cold ~1.7 GB downloads that
  # hit HuggingFace in parallel and 429'd, which is exactly the stampede
  # `warm_models` above exists to prevent, one platform later. Measured on run
  # 31418525447: `likeness pipeline did not settle in time` behind five retries
  # of `HTTP Error 429` per file.
  # ---------------------------------------------------------------------------
  warm_models_windows:
    name: warm model cache (Windows)
    runs-on: windows-latest
    # Only a `push` can save this cache (see the save step), so only a `push`
    # runs the prefetch — and a run that never fetches has no use for the
    # token. Scoping it this way keeps the secret out of the environment on
    # pull-request runs, which are the ones that execute the PR's own tree via
    # `pip install .`. The shards below still carry it unconditionally: they
    # reach HuggingFace during the tests themselves.
    env:
      HF_TOKEN: ${{ github.event_name == 'push' && secrets.HF_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - id: models
        uses: ./.github/actions/model-cache

      # `setup-backend` caches pip at ~/.cache/pip, which is not where pip
      # caches on Windows, so it is Linux-only and this is its counterpart.
      # Deliberately no pip cache: this job installs only to run the prefetch,
      # and a second 0.4 GB Windows entry is not worth it against the 10 GB
      # repo budget this change is trying to get back under.
      - name: Set up Python
        if: steps.models.outputs.hit != 'true' && github.event_name == 'push'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.models.outputs.hit != 'true' && github.event_name == 'push'
        run: |
          python -m pip install --upgrade pip
          pip install .[test,dev]

      - name: Download every model the Windows shards load
        if: steps.models.outputs.hit != 'true' && github.event_name == 'push'
        run: python scripts/prefetch_ci_models.py

      - name: Save the model cache
        if: >-
          success() && steps.models.outputs.hit != 'true'
          && github.event_name == 'push'
        uses: ./.github/actions/model-cache
        with:
          mode: save
          key: ${{ steps.models.outputs.key }}

  # ---------------------------------------------------------------------------
  backend:
    name: backend shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # The shards only read the model cache; `warm_models` is what fills it.
    # Waiting on it is the serialisation that stops eight runners cold-fetching
    # the same weights at once.
    #
    # `needs:` alone would turn a failed warming job into eight SKIPPED shards,
    # not eight failed ones — the skipped-is-not-failed ambiguity this repo
    # already had to design against once (see the removed `build` aggregator
    # note below). Warming is an optimisation, never a correctness gate, so
    # `!cancelled()` keeps the ordering and drops the veto: if warming breaks,
    # the shards still run, still report red or green on their own merits, and
    # `warm model cache` is the red check that says why they were slow.
    needs: warm_models
    if: ${{ !cancelled() }}
    strategy:
      # Every shard must report: one shard failing tells you nothing about the
      # other seven, and a partial picture costs another full round trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # HF_TOKEN lifts HuggingFace's anonymous-download rate limit, which was
    # throttling cold model fetches past the import tests' 10s timeout. Use a
    # READ-ONLY, public-scope fine-grained token: that minimal scope is the
    # compensating control for exposing it job-wide. Set job-wide rather than
    # per-step so a newly added pytest step can't silently reintroduce the
    # flake. Absent on fork PRs by design — GitHub withholds secrets from
    # forked-PR runs, which fall back to unauthenticated downloads. Do NOT
    # switch those to pull_request_target.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Backend tests (shard ${{ matrix.shard }} of 8)
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/8"
          tests/multi_project_authz/test_generic_field_reader_allowlist.py
          tests/multi_project_authz/test_multi_project_membership_authz.py
          tests/test_adapter_attachment.py
          tests/test_adapter_header.py
          tests/test_aitoolkit_run.py
          tests/test_anomaly_region_scope.py
          tests/test_app_permission_repair.py
          tests/test_architecture_guardrails.py
          tests/test_async_import_staging.py
          tests/test_auth_read_path.py
          tests/test_authentication.py
          tests/test_authz_gate_step3.py
          tests/test_authz_gate_step4.py
          tests/test_authz_host_capability_16_3.py
          tests/test_authz_library_pin.py
          tests/test_backend_order_stability.py
          tests/test_batch_character_likeness_scope.py
          tests/test_builtin_models.py
          tests/test_character_face_assignment.py
          tests/test_characters_api.py
          tests/test_checkpoint_hash_finder.py
          tests/test_ci_shards.py
          tests/test_cli_documentation.py
          tests/test_clip_text_embedding_similarity.py
          tests/test_comfyui_api_prompt_extraction.py
          tests/test_comfyui_pixlstash_saver.py
          tests/test_comfyui_recipe_preflight.py
          tests/test_comfyui_recipe_route.py
