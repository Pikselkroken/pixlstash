  # ---------------------------------------------------------------------------
  # RELEASE-PREP ONLY — informational ordering sweep, sharded by contiguous
  # block.
  #
  # This job's value is the ORDER, not coverage: the gate deals its tests
  # round-robin, which is exactly the thing that could hide (or cause) an
  # order- or shard-dependence. This job is the control for that.
  #
  # Note it is ALSO the only run for the files in DEFERRED_FROM_GATE
  # (tests/test_ci_shards.py) — a substantial slice of tests/. Those are
  # therefore covered only here, only during release prep, and only
  # informationally. That is a known gap, not a design goal: an earlier version
  # of this comment claimed "the whole suite now blocks on every run", which was
  # never true and contradicted the deferral list in the same tree. The
  # behavioural authz/fail-closed suites used to be in that gap and are now
  # gated; prefer moving the remaining files onto the gate over relying on this
  # sweep. It keeps the `continue-on-error` semantics — a red here is a triage
  # signal, not a gate failure — and the release-prep trigger.
  #
  # It used to be one process running `pytest tests/` end to end: the perfect
  # control, at ~40-50 min, on the critical path of every release prep. It is
  # now split across a matrix, which necessarily weakens the control, so the
  # split was chosen to give up as little of it as possible:
  #
  #  * `--ci-block-shard i/N` (tests/conftest.py) gives shard i the i-th
  #    CONTIGUOUS slice of the canonical collection order. Relative order is
  #    preserved inside every shard, so any order dependence between two tests
  #    still fails unless the pair happens to straddle one of the N-1 block
  #    boundaries. Weaker than one process; far stronger than round-robin.
  #  * NOT `--ci-shard`. Reusing the gate's round-robin here would shard the
  #    shard-dependence detector with the same dealing algorithm it exists to
  #    audit — the one arrangement guaranteed to prove nothing.
  #  * Not "contiguous blocks of whole files" either. It preserves a little
  #    more (boundaries always land between files), but it cannot split a slow
  #    single file such as the 6-min test_server.py, so the slowest shard would
  #    still be most of the wall clock. Test-level blocks lose at most N-1
  #    adjacency points to buy a real split. (This bullet used to cite a
  #    "~20-min authz block" as the other example; the seven behavioural authz
  #    files were measured at 182 s total on 2026-07-26 and are now gated, so
  #    test_server.py is the real case.)
  #  * Not "keep one full-order job, but only on refs/tags/v*". That preserves
  #    the control perfectly and loses it exactly where it is wanted: an
  #    ordering bug found at tag time is found after the release candidate has
  #    already been signed off, and it puts a 50-min serial job on the tag
  #    build's critical path.
  #
  # N=6. Two reasons, and the second is the binding one. (1) Concurrency: the
  # rest of this workflow queues 14 jobs (checks 1 + backend 8 + e2e 1 +
  # backend_windows 4) against the Team plan's
  # 60-concurrent-job budget, so 6 fits without the sweep queueing behind the
  # gate it is supposed to run alongside — and unlike the gate it runs only
  # during release prep, when there is rarely a queue of feature-branch runs
  # competing. (2) Diminishing returns: the fixed per-runner cost here (disk
  # reclaim + pip install + HuggingFace cache restore) is ~10 min and does not
  # shard, so past ~6 shards each extra runner buys a minute or two of test
  # time and pays a full setup for it. Expected wall clock ~16-20 min: ~10 min
  # setup plus the slowest block. Blocks are equal in test COUNT, not in test
  # TIME — that imbalance is the price of preserving order.
  #
  # The per-shard check name is NOT stable across a resize, by design: this job
  # is informational and must never be a required check. Nothing is a required
  # check in this repo — see the removal note above `e2e`.
  #
  # The old "1.7.0 headline API surface" step is gone: its five files
  # (test_tag_health_api, test_reviews_api, test_tag_predictions_api,
  # test_tag_suggestions_api, test_tagger_runs_api) are now collected and
  # blocking on every run, which is strictly stronger than blocking only during
  # release prep.
  # ---------------------------------------------------------------------------
  backend_release_sweep:
    name: backend-full block ${{ matrix.shard }} (informational, release-prep only)
    if: ${{ !cancelled() && (startsWith(github.head_ref || github.ref_name, 'rc-prep') || startsWith(github.head_ref || github.ref_name, 'release') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Same reason as the gate: read the model cache, never fill it, and never
    # let a failed warming job silently skip the sweep instead of running it.
    needs: warm_models
    strategy:
      # Every block must report, for the same reason as the gate: one red block
      # says nothing about the other five, and release prep cannot afford
      # another full round trip to find out.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # See the `backend` job for the rationale and the read-only token requirement.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Full suite in collection order (block ${{ matrix.shard }} of 6)
        continue-on-error: true
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-block-shard "$CI_SHARD/6"
          tests/

  # ---------------------------------------------------------------------------
  # REMOVED 2026-08-09 (#796): the `build` and `build-windows` aggregator jobs.
  # They existed only to give branch protection one stable check name per OS,
  # and there is no branch protection to serve: `develop` has none, `main` is
  # protected with no required_status_checks at all, and merges are a human
  # judgement call by design. `build` also cost real tail latency — it needed
  # every Linux job, so it queued for its own runner after the gate finished
  # (up to ~16 min for a 3-second job).
  #
  # They carried one property beyond aggregation (CSO condition F2): `skipped`
  # counted as a FAILURE for `checks`/`backend`, so a `paths:`/`if:` filter
  # could not leave a green required check that ran zero tests (`skipped` was a
  # pass only for `backend_release_sweep`, which is skipped outside release
  # prep by design). That is moot while nothing is required. Anything that
  # reintroduces a required status check, or adds a `paths:`/`if:` filter to
  # the gate, MUST restore the skipped-is-failure guard with it.
  # ---------------------------------------------------------------------------

  e2e:
    # Playwright UI tests drive the real SPA against a backend booted on a
    # throwaway copy of the committed test-data/ fixture (browse-only: workers
    # disabled, no ML models needed). The fixture is committed release input:
    # its absence is a coverage failure, never permission to skip the lane.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require committed e2e fixture
        id: fixture
        run: |
          set -euo pipefail
          git ls-files --error-unmatch test-data/images/vault.db
          test -f test-data/images/vault.db
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.fixture.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        if: steps.fixture.outputs.present == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          # Deliberately the SAME key as the setup-backend composite, so this
          # job and the backend shards share one pip download cache instead of
          # keeping two near-identical copies per ref.
          #
          # The trade-off is real and was decided on a measurement, not a
          # guess. This job installs `pip install .` while the composite
          # installs `.[test,dev]`, and actions/cache only writes on a key
          # miss — so whichever job races to the miss first fixes the contents
          # for both, and the loser re-downloads its delta on every run
          # without ever getting a miss to re-save. That delta was the whole
          # question, so it was measured: a separate `pip-e2e-cpu-` namespace
          # saved 494 MB against the composite's 507 MB. The test/dev extras
          # are ~13 MB of small pure-Python wheels; that is the entire cost of
          # losing the race. Against it, a second namespace costs ~494 MB on
          # every active ref, in a repo already evicting entries against
          # GitHub's 10 GB limit — which is what makes runs miss cache and
          # install cold in the first place. 13 MB per run beats 494 MB per
          # ref. Contents cannot diverge dangerously either way: pip's HTTP
          # cache is keyed by URL, so a subset or superset just means pip
          # downloads whatever is not there.
          #
          # `-cpu-` is not optional in either design: restore-keys is a prefix
          # match, so the old `pip-` prefix would restore the 2.79 GB CUDA-fat
          # cache and re-save those nvidia wheels forever.
          key: pip-cpu-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
          restore-keys: pip-cpu-${{ runner.os }}-py3.12-

      - name: Install backend
        if: steps.fixture.outputs.present == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # CPU-only torch, CI ONLY — same treatment the setup-backend
          # composite got, which this job cannot share because it has its own
          # inline Python setup. This runner only drives Chromium against a
          # browse-only backend (workers disabled, no ML models), so the CUDA
          # payload PyPI's torch drags in (nvidia-*-cu13, triton, ~2.5 GB
          # unpacked) is pure cost: it was most of the 92 s install and the
          # reason this job's pip cache was 2.79 GB.
          # The specifiers are pyproject.toml's own, so CI resolves exactly
          # the version it resolves today and just takes the +cpu build of it;
          # `pip install .` below then finds the requirement already satisfied
          # and leaves it alone. --index-url, not --extra-index-url: it
          # confines this one invocation to PyTorch's own index instead of
          # letting a second index shadow PyPI names. Nothing a user installs
          # changes — `pip install -e .` still resolves the GPU build.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch~=2.12" "torchvision~=0.27"
          pip install .
          df -h /
          # Fail loudly if a pin change ever lets PyPI's CUDA torch win again.
          # sed, not `grep -q`: under `pipefail` an early-exiting grep SIGPIPEs
          # pip and the guard fires on its own plumbing instead of the version.
          torch_version="$(pip show torch | sed -n 's/^Version: //p')"
          case "$torch_version" in
            *+cpu) echo "torch $torch_version" ;;
            *)
              echo "::error::torch is $torch_version, not a +cpu build; the CUDA wheels are back."
              exit 1
              ;;
          esac

      - name: Set up Node
        if: steps.fixture.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and Chromium
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd frontend
          npm ci
          # This job used to reclaim runner disk with jlumbroso/free-disk-space
          # (88 s) before installing anything. That step is gone, so the
          # headroom is measured instead of assumed - and measured BEFORE
          # Chromium lands, because that is the download that runs out of it.
          # A bare `df` after the fact prints on the green runs and is missing
          # on the one that matters: the job dies inside `playwright install`
          # with an ENOSPC that reads as a Playwright bug. A warning, not a
          # failure: 4 GiB is a heuristic, and a heuristic must not be able to
          # fail a build on its own. If this fires, put the reclaim step back.
          avail_kb="$(df --output=avail -k / | tail -1)"
          if [ "$avail_kb" -lt 4194304 ]; then
            echo "::warning title=Low runner disk::Only $((avail_kb / 1024)) MiB free on / before installing Chromium. If this job failed with ENOSPC, that is why; restore the jlumbroso/free-disk-space step."
          fi
          npx playwright install --with-deps chromium
          df -h /

      - name: Run Playwright e2e
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright report
        if: ${{ always() && steps.fixture.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows only validates OS-sensitive behaviour (file/path/process handling,
  # DB file swap, server startup, image libs). The ML-inference tests are
  # OS-independent — PyTorch/CLIP/InsightFace behave the same on Windows — so
  # they run on Linux only to keep this job fast. That subset is therefore a
  # deliberate scope choice, not a gate, which is why this job keeps an explicit
  # file list while the Linux gate does not: the completeness guarantee lives on
  # Linux, and a file missing here costs Windows-specific breadth, not coverage.
  #
  # The list is sharded with the same `--ci-shard` mechanism, without xdist:
  # `test_server.py` alone was 13 min of the 30, and splitting by test (rather
  # than by file) is what actually breaks that up. Job-level sharding adds no
  # intra-process concurrency, so it introduces no new flake surface on the
  # platform that is hardest to debug remotely.
  #
  # Four shards, and this one does NOT track the Linux gate's count. Windows
  # pays the worst fixed cost per shard of any job here: measured on run
  # 31296192128 (`backend-windows shard 2`), checkout + Node + Python + caches
  # is 41 s and `pip install .[test,dev]` another 160 s, so ~3.6 min of every
  # shard is spent before a test runs. That is what caps this at 4 rather than
  # the gate's 8 — ~35 min of Windows test compute over 4 shards is 8.75 min of
  # tests + 3.6 min setup = ~12 min per shard, and doubling again would buy ~4
  # min of test time per runner while paying 3.6 min of setup for it. Measured
  # after the resize (run 31302551327): 12.3 / 13.2 / 13.7 / 13.9 min.
  #
  # Note that #801's CPU-only-torch install fix does NOT apply here: the
  # `nvidia-*-cu13` / `cuda-toolkit` wheels are gated `platform_system ==
  # "Linux"`, and the caches agree (pip-Windows-py3.12 0.37 GB against
  # pip-Linux-py3.12 2.79 GB). There is no CUDA payload on this runner to
  # remove, so the 160 s install above is the floor.
  #
  # It was 2 until 2026-08-09. Half of that argument was the 20-slot
  # concurrency cap; the move to the GitHub Team plan (60 concurrent jobs)
  # removed that half, and only the fixed-cost arithmetic above still holds.
  # The resize saves nothing today — that same run had this job at 21.2 min
  # against the Linux gate's ~21.3 min, i.e. tied. It is pre-emptive: the
  # in-flight test-fixture work takes Linux to roughly 16 min, at which point
  # an unshrunk Windows job becomes the critical path on its own.
  #
  # This is also a deliberate SUBSET rather than a gate, so it is the cheaper
  # place to give up parallelism: the completeness guarantee lives on Linux.
  # ---------------------------------------------------------------------------
  backend_windows:
    name: backend-windows shard ${{ matrix.shard }}
    # Same reason `backend` waits for `warm_models`: without the gate all four
    # shards start cold together and re-run the very stampede the warm job
    # exists to absorb. On the warm path this costs the shards a checkout and a
    # cache restore they were doing anyway.
    needs: warm_models_windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # See the `backend` job for the rationale and the read-only token requirement.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # This job intermittently exits 139 SECONDS AFTER pytest prints a fully
      # green summary, with no traceback anywhere in the log. pytest's bundled
      # faulthandler plugin tears itself down in pytest_unconfigure, so it is
      # already gone by then; that places the crash in Py_FinalizeEx. The env
      # var enables faulthandler at interpreter start-up instead, where nothing
      # can unregister it, so the next occurrence names the thread and frame.
      # Costs nothing: it only installs a signal handler, and prints only if
      # the process actually dies on a fatal signal.
      PYTHONFAULTHANDLER: 1
    steps:
      - uses: actions/checkout@v6

      # The wheel build (pip install . below) runs `npm ci` via setup.py. Set up
      # Node with an npm cache so that step pulls tarballs from the warm cache
      # instead of cold over the network on every run — the main source of the
      # ECONNRESET flake here. Matches electron.yml / windows-installer.yml.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,dev]

      # Restore-only, through the same action every Linux job uses. This was an
      # inline read/write `actions/cache` with its own paths and a key hashing
      # three of the six files the shared one hashes — two definitions that
      # could never share an entry, and the writing half is what filled the
      # repo's cache budget with per-PR copies. `warm_models (windows-latest)`
      # is now the single writer, exactly as on Linux.
      - name: Restore the HuggingFace model cache
        uses: ./.github/actions/model-cache

      - name: OS-sensitive backend tests (shard ${{ matrix.shard }} of 4)
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/4"
          tests/test_migrations.py
          tests/test_snapshots.py
          tests/test_restore.py
          tests/test_snapshots_auth.py
          tests/test_metadata_hash.py
          tests/test_architecture_guardrails.py
          tests/multi_project_authz/test_multi_project_membership_authz.py
          tests/test_openapi_response_schemas.py
          tests/test_find_orphaned_files.py
          tests/test_library_layout.py
          tests/test_server.py
          tests/test_authentication.py
          tests/test_rate_limiter.py
          tests/test_picture_sets.py
          tests/test_picture_stack_utils.py
          tests/test_picture_plugins.py
          tests/test_comfyui_api_prompt_extraction.py
          tests/test_comfyui_recipe_preflight.py
          tests/test_comfyui_recipe_route.py
          tests/test_comfyui_submit_prompt.py
          tests/test_comfyui_workflow_extraction.py
          tests/test_watch_folder_worker.py
          tests/test_work_planner.py

      # `PYTHONFAULTHANDLER` above did not name it, and that is itself the
      # finding: pytest's faulthandler plugin restores the handler in its
      # `pytest_unconfigure` whenever the env var enabled it (verified in
      # `_pytest/faulthandler.py`), so it IS armed all the way into
      # `Py_FinalizeEx` — and six of these crashes have still printed nothing.
      # A handler that is live and silent puts the fault beyond CPython's reach
      # entirely: past `_PyFaulthandler_Fini`, in native teardown. Windows logs
      # one layer below that, an Application Error record naming the faulting
      # module, its version and the fault offset — the DLL this has never been
      # able to name.
      #
      # Read the event rather than shipping a minidump: artifacts on a public
      # repository are downloadable by anyone, and dumped process memory reaches
      # the environment block, which is where this job's `HF_TOKEN` lives. An
      # event record carries module names and offsets and no memory at all.
      - name: Name the faulting module
        if: failure()
        shell: pwsh
        run: |
          $events = Get-WinEvent -MaxEvents 5 -ErrorAction SilentlyContinue -FilterHashtable @{
            LogName      = 'Application'
            ProviderName = 'Application Error', 'Windows Error Reporting'
          }
          if (-not $events) {
            Write-Host 'No Application Error record: this failure was not a native crash.'
            exit 0
          }
          foreach ($event in $events) {
            Write-Host "--- $($event.TimeCreated.ToString('o')) [$($event.Id)] $($event.ProviderName)"
            Write-Host $event.Message
          }

  # The `build-windows` aggregator over this job was removed with `build` in
  # #796 — see the note where `build` used to be, above `e2e`.
