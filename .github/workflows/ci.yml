
name: CI

permissions:
  contents: read

# A superseded run has nothing left to prove, and its runners are exactly what
# the replacement run queues behind. Cancel them on feature branches; keep every
# run on the protected branches so the record of what was green on main/develop
# stays complete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

# `push:` used to be unfiltered, so every commit on a PR branch started the
# workflow twice — once for the push and once for the pull_request — running
# the same tests on the same SHA. That was ~2x waste when CI was three jobs;
# with the sharded matrix below it is the difference between fitting in the
# account's 20-concurrent-job budget and queueing behind a redundant copy of
# yourself. PR branches are covered by `pull_request`; the branches that get
# pushed to without a PR (protected, release-prep) and release tags are listed
# explicitly.
on:
  push:
    branches:
      - main
      - develop
      - 'release-**'
      - 'rc-prep-**'
    tags:
      - 'v*'
  pull_request:
  # Lets release-prep force the informational full-suite sweep on demand (the
  # single-process sweep job below keys off this event).
  workflow_dispatch:

env:
  # Shared pytest flags for every backend job.
  #
  # Verbosity is deliberately lower than the local command documented in
  # CLAUDE.md (`-s -vvv --log-cli-level=INFO`). `-s` disables capture, so every
  # INFO line of a ~900-test suite is streamed into the Actions log: slow to
  # write, slow to fetch, and unreadable. Capture stays ON here and the level
  # stays at INFO, so a *failing* test still reports its full captured log —
  # the debugging signal is unchanged, only the noise from passing tests is
  # gone. `-ra` lists every non-passing outcome in the trailing summary.
  #
  # `--durations=0 --durations-min=0` is the data source for the time-balanced
  # `--ci-shard` deal (tests/conftest.py). It reports every test's setup/call/
  # teardown time, which `scripts/record_test_durations.py` turns back into the
  # committed tests/ci_test_durations.json. `--durations-min=0` (rather than
  # pytest's 0.005 s default) is what makes the map COMPLETE: a test omitted
  # for being fast would be indistinguishable from a test that is new, and the
  # sharder charges an unknown test the median cost, which for a 2 ms test is
  # wrong by two orders of magnitude. The price is ~3 extra log lines per test.
  # This changes no test's behaviour and adds no runtime — it only prints.
  PYTEST_FLAGS: >-
    -q -ra --log-level=INFO --fast-captions --force-cpu
    --durations=0 --durations-min=0

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, high-signal checks. Deliberately has no HF_TOKEN: it runs no pytest
  # step, so it needs no HuggingFace downloads, and the token is kept to the
  # jobs that actually do.
  # ---------------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Verify wheel includes Alembic assets
        run: |
          set -e
          python -m pip wheel . --no-deps -w /tmp/pixlstash-wheelcheck
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob('/tmp/pixlstash-wheelcheck/pixlstash-*.whl'))[-1]
          required = [
              'pixlstash/alembic.ini',
              'pixlstash/migrations/env.py',
              'pixlstash/migrations/script.py.mako',
              'pixlstash/migrations/versions/0001_baseline.py',
          ]

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          missing = [name for name in required if name not in names]
          if missing:
              print('Missing required files in wheel:')
              for name in missing:
                  print(f' - {name}')
              sys.exit(1)

          print('Wheel Alembic asset check passed.')
          PY

      - name: Check formatting with ruff
        run: |
          ruff check pixlstash

      - name: Check backend_architecture.md is up to date
        run: |
          python scripts/render_backend_architecture.py --check

      - name: Test Frontend Utilities
        run: |
          cd frontend
          npm ci
          npm test

      # `npm run lint` is `tsc --noEmit`. `npm test` compiles with
      # tsconfig.test.json, which only covers src/ + test/; the lint pass is
      # what type-checks the main-process build as electron-builder will.
      - name: Test Electron shell
        working-directory: electron
        run: |
          npm ci
          npm run lint
          npm test

      - name: Install telemetry Worker dependencies
        working-directory: website/telemetry-worker
        run: npm ci

      - name: Test telemetry Worker
        working-directory: website/telemetry-worker
        run: npm test

      - name: Validate telemetry Worker config and D1 binding
        working-directory: website/telemetry-worker
        run: npm run check:config

  # ---------------------------------------------------------------------------
  # The backend gate. Split across 4 runners instead of one job with 22
  # sequential steps.
  #
  # Four, not eight. The binding constraint is the account's 20-concurrent-job
  # budget, and it binds ACROSS RUNS, not within one. Measured on 2026-08-05
  # between 16:09 and 18:35, seven CI runs were in flight simultaneously at
  # 17:47; at the then-current 17 jobs per run that is ~119 jobs demanded
  # against 20 slots. The cap was directly observable in run 30981632678
  # (tag v1.9.0rc1): exactly 20 jobs started at +0-4 min and the 21st,
  # `backend shard 1`, waited 8.2 min for a slot. In run 30981629822 every one
  # of the 14 test jobs was created at 06:40:28 and started between 06:48:14
  # and 06:57:20 — an 8-17 min queue before any test ran. The same saturation
  # shows up at the other end of a run: the trivial `build` aggregator queued
  # 13m 00s in run 31031336234 and `build-windows` 16m 47s in run 31023904354,
  # and both runs ended within 3 seconds of that job finally starting.
  #
  # Under a hard slot cap, jobs-per-run is the lever, not seconds-per-test.
  # Eight shards cannot spend the parallelism they ask for, and each one pays
  # its own ~4 min of setup-backend (free-disk-space + setup-python + pip
  # install + HuggingFace cache restore). At eight that is ~32 min of runner
  # time per run before a single test executes, all of it competing for the
  # same scarce slots as real work. Halving the matrix halves that fixed cost
  # and returns four slots per run. Together with the two Windows shards this
  # takes ci.yml from 16 jobs to 10, so two concurrent runs now fit inside the
  # budget where one used to fill it.
  #
  # The trade-off is real and was taken deliberately, and the number is not
  # small. LPT over the committed map puts 1360 s of recorded load on each of
  # four shards (vs 680 s on each of eight); CI measures ~1.77x the recorded
  # local time (shard 7 of run 31031336234: 1202 s in CI against a ~680 s
  # recorded share), so expect roughly 40 min of tests per shard plus ~4 min
  # setup, against ~20 min before. An UNCONTENDED run therefore gets slower —
  # ~45 min instead of ~25. It wins only because runs overlap, which is the
  # normal state here, and because a failed shard now costs one slot for 45
  # min instead of eight slots for 20.
  #
  # If that is too long, 6 is the middle setting (~27 min per shard, 12 jobs
  # per run) and the balance guardrail
  # (test_ci_shards.py::test_recorded_durations_actually_balance_the_gate)
  # reads N from this matrix, so it re-proves the split on any resize. If the
  # concurrency budget is ever raised, revisit this number FIRST — it is the
  # cheapest thing here to tune.
  #
  # The durable fix is not the shard count: 43 files boot a full Server with
  # the ML worker fleet per test function and account for ~73% of suite time
  # (~5.6 s/test against ~1.5 s/test for the files that pass
  # disable_background_workers). Bring that down and both the shard count and
  # its wall clock stop mattering.
  #
  # The list below is the GATED set. The ~52 files that are not in it are not
  # forgotten — they are declared as DEFERRED in tests/test_ci_shards.py, and
  # that test fails if any file under tests/ is in neither list. Adding a test
  # file therefore forces an explicit decision: gate it, or record why it is
  # deferred. That is the property that matters, because the old design had no
  # such forcing function — a new file was gated only if whoever added it also
  # remembered to edit this workflow, and PR #588 is a live example of one that
  # did not.
  #
  # The seven behavioural authz/fail-closed suites — test_authz_gate_step3,
  # test_authz_gate_step4, test_authz_host_capability_16_3,
  # test_ip_locality_fail_closed, test_pictures_stream, test_scrapheap_retention
  # and test_async_import_staging — are gated here and MUST stay gated. Policy
  # *declaration* completeness has always blocked every PR
  # (test_architecture_guardrails.py::test_all_routes_declare_access_policy);
  # these are the other half, the ones that prove the AuthzGate actually
  # ENFORCES what it declares. While they were deferred their only run was the
  # non-blocking release-prep sweep, and a broken assertion in one of them sat
  # undetected for five days. tests/test_ci_shards.py::
  # test_security_suites_cannot_be_quietly_deferred fails if any of them is
  # removed from this list or parked back in DEFERRED_FROM_GATE.
  #
  # Cost of gating them, measured rather than assumed (2026-07-26): the seven
  # files are 151 tests in 182 s wall clock on a machine calibrated against this
  # runner (gate shard 6/8 = 238 s locally vs 257 s in CI, so ~1.08x). That is
  # ~3.3 min of extra test time; spread over the four shards below it is
  # roughly +50 s per shard, not the ~20 min the block was previously assumed
  # to cost. This does NOT approach the widened release-prep budget, and it
  # must not: regular PRs stay fast.
  #
  # Why the rest of the deferred set is not simply gated too: it is not yet
  # known green, and some of it is not deterministic. Measured 2026-07-26,
  # tests/test_smart_score_invalidation.py returns a DIFFERENT pass count
  # depending on machine load — 41 passed on an idle tree, 4 failed under two
  # concurrent workloads — because its assertions race an async invalidation
  # that has not landed yet (the failures read `assert <float> is None`).
  # Collection order is deterministic (no randomising plugin), so load is the
  # variable. Do not record a specific failure count for that file, and do not
  # gate it on a loaded runner, which is its failing condition. Most of the
  # rest have simply never run as a blocking check. Gating them today would
  # turn every PR red. The flip to full discovery (`pytest tests/`, no list at
  # all) is a follow-up, blocked on getting the deferred set green AND on
  # making the load-sensitive ones deterministic — the informational sweep
  # below keeps it
  # visible in the meantime.
  #
  # `--ci-shard i/N` (implemented in tests/conftest.py) splits by *test* rather
  # than by file, which is what breaks up the authz suites and the 6-minute
  # test_server.py, and it balances the shards by RECORDED TIME
  # (longest-processing-time-first over the committed
  # tests/ci_test_durations.json). It used to deal round-robin by position:
  # that equalises test count perfectly and test time not at all, and the
  # measured result on run 30925279472 was 744 s to 1205 s across the then
  # eight shards — a 1.62x spread, with the gate waiting on shard 7 while
  # shard 6 had been idle for ~460 s. Time balancing matters MORE at four
  # shards than at eight: with fewer, larger buckets a single misplaced slow
  # file moves the critical path further.
  #
  # The durations map is committed rather than cached because all four shards
  # must compute the SAME partition without communicating; see the module
  # docstring of scripts/record_test_durations.py, which also regenerates it.
  # A test missing from the map keeps its old round-robin position and a
  # missing or corrupt map degrades the whole deal back to round-robin, so
  # stale data costs wall clock and never coverage.
  # tests/test_ci_shards.py asserts the matrix below and the `/N` in the
  # command agree, and that the split stays an exact partition under all of
  # those degraded inputs.
  #
  # Parallelism is deliberately across runners only, NOT pytest-xdist inside a
  # runner. xdist is installed (and is a good local `-n auto`), but two attempts
  # to validate the ML-heavy half of the suite under `-n auto` ended with every
  # worker aborting during teardown — "terminate called without an active
  # exception", a C++ thread-pool destructor firing while onnxruntime/torch
  # state was being released in conftest's pytest_sessionfinish. That is a
  # crash with no failing test attached to it, which is the worst kind of CI
  # flake to debug. Sharding across jobs buys the same wall clock with one
  # single-threaded pytest per runner and no new native-teardown concurrency.
  # Revisit `-n 2` only with a green measured run behind it.
  # ---------------------------------------------------------------------------
  backend:
    name: backend shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard must report: one shard failing tells you nothing about the
      # other three, and a partial picture costs another full round trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # HF_TOKEN lifts HuggingFace's anonymous-download rate limit, which was
    # throttling cold model fetches past the import tests' 10s timeout. Use a
    # READ-ONLY, public-scope fine-grained token: that minimal scope is the
    # compensating control for exposing it job-wide. Set job-wide rather than
    # per-step so a newly added pytest step can't silently reintroduce the
    # flake. Absent on fork PRs by design — GitHub withholds secrets from
    # forked-PR runs, which fall back to unauthenticated downloads. Do NOT
    # switch those to pull_request_target.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Backend tests (shard ${{ matrix.shard }} of 4)
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: >-
          python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/4"
          tests/test_adapter_attachment.py
          tests/test_adapter_header.py
          tests/test_aitoolkit_run.py
          tests/test_anomaly_region_scope.py
          tests/test_architecture_guardrails.py
          tests/test_async_import_staging.py
          tests/test_auth_read_path.py
          tests/test_authentication.py
          tests/test_authz_gate_step3.py
          tests/test_authz_gate_step4.py
          tests/test_authz_host_capability_16_3.py
          tests/test_authz_library_pin.py
          tests/test_backend_order_stability.py
          tests/test_batch_character_likeness_scope.py
          tests/test_character_face_assignment.py
          tests/test_characters_api.py
          tests/test_ci_shards.py
          tests/test_clip_text_embedding_similarity.py
          tests/test_comfyui_api_prompt_extraction.py
          tests/test_comfyui_pixlstash_saver.py
          tests/test_comfyui_recipe_preflight.py
          tests/test_comfyui_recipe_route.py
          tests/test_comfyui_stack_filter.py
          tests/test_comfyui_submit_prompt.py
          tests/test_comfyui_workflow_extraction.py
          tests/test_database_engine_config.py
          tests/test_dedup_mixed_stacks.py
          tests/test_dedup_sweep_api.py
          tests/test_dedup_sweep_service.py
          tests/test_dedup_tier_service.py
          tests/test_dedup_tiers_api.py
          tests/test_dedup_verdict_service.py
