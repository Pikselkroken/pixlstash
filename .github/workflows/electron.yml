name: Build Electron Desktop App

# Builds the cross-platform desktop app for a release:
#   1. build the pixlstash wheel once (shared, also published to PyPI),
#   2. per OS: build the bundled CPU/Metal Python runtime, embed it via
#      electron-builder extraResources, and build the installers.
# GPU acceleration (CUDA/ROCm) is NOT bundled or hosted. The desktop app adds it
# on demand by pip-installing the heavy wheels straight from PyPI / PyTorch.
on:
  push:
    tags:
      - "v*"
  # PRs run only the cheap `test` job below (the build jobs are gated to
  # non-PR events), so desktop-shell logic regressions surface before release.
  pull_request:
    paths:
      - "electron/**"
      - ".github/workflows/electron.yml"
  workflow_dispatch:

# Least privilege: all jobs use a read-only GITHUB_TOKEN. Release uploads use
# RELEASE_BOT_TOKEN only in the action step that attaches each artifact.
permissions:
  contents: read

jobs:
  # Fast desktop-shell logic gate: the node --test suite in electron/test/
  # (GPU-overlay CPU fallback, per-accel onnxruntime pins, pip-constraints
  # filtering, install-arg construction). Needs only Node — no Python runtime,
  # no electron-builder, no display server — so it always runs on cheap ubuntu:
  # standalone on pull requests, and as a fail-early gate ahead of the
  # expensive multi-OS build matrix on tag/dispatch runs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # CSO hardening: untrusted fork `npm ci` scripts run after checkout,
          # and this job needs no git credentials once the tree is on disk.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Run desktop tests
        working-directory: electron
        run: |
          npm ci
          npm test

  build-wheel:
    # Builds run on tag pushes / manual dispatch only; PRs stop at `test`.
    # (build-electron chains off this job, so it is skipped on PRs too.)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      validated_release_tag: ${{ steps.release-ref.outputs.validated_release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Resolve version
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pre=$(python -c "from packaging.version import Version;print('true' if Version('$version').is_prerelease else 'false')")
          echo "is_prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Classify and validate release ref
        id: release-ref
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "validated_release_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Release ref/tag mismatch: $RELEASE_REF / $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$ ]]; then
            echo "Release tag has an unsupported format: $RELEASE_TAG" >&2
            exit 1
          fi
          [ "$RELEASE_TAG" = "v$EXPECTED_VERSION" ] || { echo "tag/version mismatch"; exit 1; }
          echo "validated_release_tag=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/*.whl

  build-electron:
    needs: build-wheel
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # release_files: what this leg attaches to the GitHub release. The win
        # leg attaches nothing here — its installer is Authenticode-signed (or
        # explicitly labelled -unsigned) and attached by the sign-windows-desktop
        # / attach-windows-desktop-unsigned jobs below.
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            accel: cpu
            release_files: |
              electron/release/*.AppImage
              electron/release/*.deb
          - runner: windows-latest
            os: win
            arch: x64
            accel: cpu
            release_files: ""
          # macOS (Apple Silicon, Metal). Branch dispatches are always unsigned;
          # only an exact validated release tag can reach the Apple signing step.
          # If the tag is valid but signing secrets are absent, the artifact still
          # receives the explicit "-unsigned" suffix.
          - runner: macos-14
            os: mac
            arch: arm64
            accel: metal
            release_files: |
              electron/release/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel
          path: dist
      - name: Cache runtime build inputs (CPython tarball + pip wheels)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build-cache
          # Keyed per platform; the build script's hash busts it when pins
          # (CPython / torch index / deps) change. restore-keys reuses the most
          # recent cache for this platform even after a bust.
          key: build-runtime-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.accel }}-${{ hashFiles('scripts/build_desktop_runtime.py') }}
          restore-keys: |
            build-runtime-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.accel }}-
      - name: Build bundled runtime (${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.accel }})
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_ACCEL: ${{ matrix.accel }}
        run: |
          WHEEL=$(ls dist/pixlstash-*.whl | head -n1)
          python scripts/build_desktop_runtime.py \
            --wheel "$WHEEL" \
            --os "$TARGET_OS" --arch "$TARGET_ARCH" --accel "$TARGET_ACCEL" \
            --output-dir electron/resources
      # Install deps in a step WITHOUT the signing secrets in scope: npm ci runs
      # third-party dependency lifecycle scripts, which must never see the Apple
      # certificate or notarisation credentials.
      - name: Install desktop dependencies
        working-directory: electron
        run: npm ci
      - name: Build unsigned Electron installers
        if: matrix.os != 'mac' || needs.build-wheel.outputs.validated_release_tag != 'true'
        working-directory: electron
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "$TARGET_OS" != "mac" ]; then
            npm run dist -- --publish never
            exit 0
          fi
          echo "::warning title=Unsigned macOS build::This build did not originate from an exact validated release tag. Apple signing credentials are not available, and the artifact is explicitly labelled '-unsigned'."
          npm run dist -- --publish never --config.mac.artifactName='${productName}-desktop-${version}-${os}-${arch}-unsigned.${ext}'

      - name: Build signed macOS Electron installer
        if: matrix.os == 'mac' && needs.build-wheel.outputs.validated_release_tag == 'true'
        working-directory: electron
        shell: bash
        # This is the only Apple-secret-bearing step. Its required dependency is
        # the build-wheel job's exact ref/tag/pyproject-version validation above.
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # macOS signs the bundled Python/torch tree (tens of thousands of files,
          # thousands of torch headers in one directory) and the runner's default
          # descriptor limit trips codesign with EMFILE. On macOS ulimit is capped by
          # the kernel kern.maxfilesperproc, so a bare `ulimit -n` silently stays low.
          # Raise the kernel caps (passwordless sudo on GitHub runners) first, then
          # the shell soft limit, and print both so any recurrence shows real numbers.
          echo "fd before: soft=$(ulimit -Sn) hard=$(ulimit -Hn) maxfilesperproc=$(sysctl -n kern.maxfilesperproc 2>/dev/null || echo n/a)"
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=131072 2>/dev/null || true
          ulimit -n 131072 2>/dev/null || ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          echo "fd after: soft=$(ulimit -Sn) hard=$(ulimit -Hn) maxfilesperproc=$(sysctl -n kern.maxfilesperproc 2>/dev/null || echo n/a)"
          # Branch on whether the signing certificate secret is available.
          # Notarisation needs no config: electron-builder notarises automatically
          # when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are all set
          # (it reads them from the environment), and skips notarisation when they
          # are absent. Setting a `notarize` value is unnecessary and `false` would
          # disable it outright.
          if [ -n "${CSC_LINK:-}" ]; then
            # electron-builder only auto-detects CSC_LINK as base64 when it starts
            # with a data: URI, is over 2048 chars, or ends with '='. A small .p12
            # can miss all three and get mistaken for a file path (build fails with
            # "... doesn't exist"). Normalise a bare base64 secret to a data: URI so
            # any valid base64 value works; leave an already-prefixed value alone.
            case "$CSC_LINK" in
              data:*) ;;
              *) export CSC_LINK="data:application/x-pkcs12;base64,${CSC_LINK}" ;;
            esac
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            if [ -z "${APPLE_ID:-}" ] && [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "::warning title=macOS signed but not notarised::Signing certificate is present but no notarisation credentials are set. The app will be signed but NOT notarised, so Gatekeeper still blocks it on download. Add APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to finish the chain."
            fi
            npm run dist -- --publish never
          else
            echo "::warning title=Unsigned macOS build::No Apple signing certificate (APPLE_CSC_LINK secret) found. Building UNSIGNED and labelling the artifact '-unsigned'. Gatekeeper will quarantine it until the APPLE_CSC_LINK / APPLE_CSC_KEY_PASSWORD secrets are added."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist -- --publish never --config.mac.artifactName='${productName}-desktop-${version}-${os}-${arch}-unsigned.${ext}'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixlstash-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.dmg
            electron/release/*.zip
      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.release_files != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: ${{ matrix.release_files }}
          prerelease: ${{ needs.build-wheel.outputs.is_prerelease == 'true' }}
          # The release notes ("which download do I want?"), set here because
          # this step always runs on a tag — the linux and mac legs both attach,
          # whatever the Windows signing state is. The other attach steps
          # deliberately omit body_path: the action resolves the body as
          # `new || existing`, so they preserve these notes instead of clearing
          # them, and two of them have no checkout to read the file from.
          body_path: .github/release-assets.md

  # Windows Authenticode signing (Certum SimplySign). The cloud key is only
  # reachable through Certum's SimplySign Desktop GUI, so signing runs on Linux
  # in the prebuilt certum-signer container, which drives that GUI headlessly
  # and signs over PKCS#11 (see .github/actions/certum-sign/ and
  # docs/windows-signing-setup.md). Gated on the WINDOWS_SIGNING_ENABLED repo
  # variable (secrets live on the windows-signing environment, which job-level
  # `if:` cannot see). Once enabled, a signing failure is a hard red job: the
  # release ships without its Windows exe until this job is rerun. The
  # -unsigned fallback below applies only while signing is not enabled.
  sign-windows-desktop:
    # SimplySign allows ONE session per account, so the desktop and server
    # sign jobs must never run at once (a tag push starts both workflows
    # together; the second login displaces the first and its PKCS#11 token
    # never activates). This group is shared by BOTH workflows: keep the name
    # identical in electron.yml and windows-installer.yml. Never cancel — a
    # queued sign job must wait, not be dropped, or a release ships unsigned.
    concurrency:
      group: certum-simplysign-session
      cancel-in-progress: false
    needs: [build-wheel, build-electron]
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: windows-signing
    container:
      # UPDATE THIS DIGEST from the "Build Certum Signer Image" workflow's step
      # summary after an image change (docs/windows-signing-setup.md §rollout).
      image: ghcr.io/pikselkroken/certum-signer@sha256:00a9d37f35d787cb584014cb95e964326018e0c92a59d1b687129c36295febb6 # built by run 30620372480 from 6bb21307
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pixlstash-desktop-win-x64
          path: signing
      - name: Sign installer
        uses: ./.github/actions/certum-sign
        env:
          CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
        with:
          files: "signing/*.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixlstash-desktop-win-x64-signed
          path: signing/*.exe
      - name: Upload signing diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signing-diagnostics-desktop
          path: |
            ${{ runner.temp }}/simplysign-redacted.log
            ${{ runner.temp }}/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Attach signed installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: signing/*.exe
          prerelease: ${{ needs.build-wheel.outputs.is_prerelease == 'true' }}

  # Fallback while signing is not enabled: ship the Windows installer with an
  # explicit -unsigned suffix (mirrors the macOS convention above). Gated on
  # the variable being EMPTY, not merely != 'true': a malformed value ('True',
  # '1') then attaches no Windows exe at all — loud — instead of silently
  # shipping unsigned while the operator believes signing is on.
  attach-windows-desktop-unsigned:
    needs: [build-wheel, build-electron]
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pixlstash-desktop-win-x64
          path: signing
      - name: Label installer as unsigned
        run: |
          set -euo pipefail
          for f in signing/*.exe; do mv "$f" "${f%.exe}-unsigned.exe"; done
          ls signing/
          echo "::warning title=Unsigned Windows build::Certum code signing is not enabled (WINDOWS_SIGNING_ENABLED repo variable / windows-signing environment secrets). Attaching the Windows installer with an '-unsigned' suffix — SmartScreen will warn users. See docs/windows-signing-setup.md."
      - name: Attach unsigned installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          files: signing/*.exe
          prerelease: ${{ needs.build-wheel.outputs.is_prerelease == 'true' }}
