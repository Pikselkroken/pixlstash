name: CLA Check

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CLA acknowledgment for backend changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request payload found; skipping.");
              return;
            }

            // Maintainer exemption: skip CLA gate for trusted owner account(s).
            // NOTE: GitHub Actions gives us the PR author login, not a verified email.
            const exemptLogins = new Set(["lindkvis"]);
            const prAuthor = String(pr.user?.login || "").toLowerCase();
            if (exemptLogins.has(prAuthor)) {
              core.info(`PR author '${prAuthor}' is exempt from CLA check.`);
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            const touchesBackend = files.some((f) =>
              String(f.filename || "").startsWith("pixlstash/")
            );

            if (!touchesBackend) {
              core.info("PR does not touch pixlstash/**; CLA check not required.");
              return;
            }

            const labels = (pr.labels || []).map((l) => String(l.name || "").toLowerCase());
            if (labels.includes("cla-signed")) {
              core.info("Found cla-signed label; passing CLA check.");
              return;
            }

            // Tested per line, and an UNCHECKED box never counts. The bare
            // sentence is still accepted on its own (a contributor who writes
            // it out rather than ticking a box has still said it), but
            // "- [ ] I have read and agree..." contains that same sentence, so
            // a body-wide match would accept the untouched prompt from
            // .github/pull_request_template.md and pass every PR unread.
            const ACK = /I have read and agree to the CLA in `pixlstash\/CLA\.md`\./;
            const UNCHECKED_BOX = /^\s*[-*]\s*\[\s*\]/;
            const body = String(pr.body || "");
            const hasAck = body
              .split(/\r?\n/)
              .some((line) => !UNCHECKED_BOX.test(line) && ACK.test(line));

            if (!hasAck) {
              core.setFailed(
                "This PR modifies pixlstash/** and requires CLA acknowledgment. " +
                "Add this line to the PR description: '- [x] I have read and agree to the CLA in `pixlstash/CLA.md`.' " +
                "(Maintainers may alternatively apply the 'cla-signed' label.)"
              );
              return;
            }

            core.info("CLA acknowledgment found in PR body.");