name: Update SECURITY.md on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.3). Used when running manually.'
        required: true

permissions: {}

env:
  # Every PixlStash this workflow boots reports itself as ours, never as a real
  # install (Server.DEV_MACHINE_ENV_VAR; guarded by tests/test_install_type_buckets.py).
  PIXLSTASH_TELEMETRY_DEV: '1'

jobs:
  # Release candidates and dev releases change nothing: no SECURITY.md, and so
  # no bot PR to close by hand. Only a plain vX.Y.Z tag goes on to the update
  # job. The website's half of a release (API reference, latest-version.json,
  # training recipes) is pixlstash-website's release-update.yml.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      final: ${{ steps.tag.outputs.final }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="$RELEASE_TAG_INPUT"
          if [ -z "$TAG" ]; then
            echo "No release tag provided." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[.-]dev[.-]?[0-9]+)?$ ]]; then
            echo "Release tag has an unsupported format: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is a pre-release; SECURITY.md is not updated."
          fi

  update:
    needs: resolve
    if: needs.resolve.outputs.final == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the script's one dependency
        run: python -m pip install packaging

      - name: Update SECURITY.md supported versions
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python main/scripts/update_security_supported_versions.py \
            main/SECURITY.md "$RELEASE_TAG"

      - name: Open pull request with the updated table
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: main
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          base: main
          branch: bot/update-security-policy-${{ needs.resolve.outputs.tag }}
          commit-message: "chore: release ${{ needs.resolve.outputs.tag }} supported versions"
          title: "chore: release ${{ needs.resolve.outputs.tag }} supported versions"
          body: |
            Automated update triggered by release **${{ needs.resolve.outputs.tag }}**.

            `SECURITY.md` — the supported-versions table, rewritten so the new
            minor is the only supported one and the minor it replaces is demoted.
            No pull request is opened for anything that is not a newer minor
            than the table already names.

            The website's half of a release (API reference, `latest-version.json`,
            training recipes) is a pull request in
            [pixlstash-website](https://github.com/Pikselkroken/pixlstash-website).
          add-paths: |
            SECURITY.md
          delete-branch: true
