name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build_prerelease_site.py'
  workflow_dispatch:

permissions: {}

env:
  # Every PixlStash this workflow boots reports itself as ours, never as a real
  # install (Server.DEV_MACHINE_ENV_VAR; guarded by tests/test_install_type_buckets.py).
  PIXLSTASH_TELEMETRY_DEV: '1'

jobs:
  # A push to main can carry copy for a version that is not out yet: site
  # pages saying 2.0 while latest-version.json, which the download links are
  # built from, still names 1.13.2 (#2647). A push deploys only once
  # pyproject.toml's version is published, i.e. after the release bot's
  # latest-version PR merges (that merge is itself a push here). A manual run
  # always deploys: gh workflow run pages.yml --ref main
  gate:
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /scripts/build_prerelease_site.py
            /website/latest-version.json
          sparse-checkout-cone-mode: false

      - name: Is this version released?
        id: released
        run: |
          python3 scripts/build_prerelease_site.py released \
            --pyproject pyproject.toml --latest-version website/latest-version.json
          if ! grep -qx 'released=true' "$GITHUB_OUTPUT"; then
            echo "::notice::Not deploying: this version is not released yet. Run pages.yml by hand once it is."
          fi

  deploy:
    needs: gate
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.gate.outputs.released == 'true')
    # Job-level, so a held push run never cancels a deploy in progress.
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # Every deploy replaces the whole site, so /prerelease/ is rebuilt on
      # each run, from the newest release candidate that is newer than the
      # stable release (or as a redirect when there is none). Publishing a new
      # RC's mirror is a manual run: gh workflow run pages.yml --ref main
      # A broken RC half must not stop the stable site deploying: on any
      # failure from here to Assemble site the mirror falls back to the
      # redirect, and the last step turns the run red after the deploy.
      - name: List releases
        id: list
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,isPrerelease,isDraft > "$RUNNER_TEMP/releases.json"

      - name: Select release candidate
        id: select
        continue-on-error: true
        run: |
          python3 scripts/build_prerelease_site.py select \
            --releases-json "$RUNNER_TEMP/releases.json"

      - name: Check out release candidate website
        if: steps.select.outputs.tag != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.tag }}
          path: rc
          sparse-checkout: website
          persist-credentials: false

      - name: Assemble site
        id: assemble
        env:
          RC_TAG: ${{ steps.select.outputs.tag }}
        run: |
          cp -r website _site
          if [ -n "$RC_TAG" ] && ! python3 scripts/build_prerelease_site.py build \
              --site-dir _site --rc-website rc/website --tag "$RC_TAG"; then
            echo "::error::Could not build the $RC_TAG mirror; deploying without it."
            echo "rc_failed=true" >> "$GITHUB_OUTPUT"
            RC_TAG=""
          fi
          if [ -z "$RC_TAG" ]; then
            python3 scripts/build_prerelease_site.py build --site-dir _site
          fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Fail if the release-candidate mirror was dropped
        if: >-
          steps.list.outcome == 'failure' ||
          steps.select.outcome == 'failure' ||
          steps.assemble.outputs.rc_failed == 'true'
        run: |
          echo "::error::The stable site deployed, but /prerelease/ is a redirect. See the failed step above."
          exit 1
