name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build_prerelease_site.py'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # Every deploy replaces the whole site, so /prerelease/ is rebuilt on
      # each run, from the newest release candidate that is newer than the
      # stable release (or as a redirect when there is none). Publishing a new
      # RC's mirror is a manual run: gh workflow run pages.yml --ref main
      - name: List releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,isPrerelease,isDraft > "$RUNNER_TEMP/releases.json"

      - name: Select release candidate
        id: select
        run: |
          python3 scripts/build_prerelease_site.py select \
            --releases-json "$RUNNER_TEMP/releases.json"

      # A broken RC half must not stop the stable site deploying: on any
      # failure the mirror falls back to the redirect, and the last step turns
      # the run red after the deploy.
      - name: Check out release candidate website
        if: steps.select.outputs.tag != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.tag }}
          path: rc
          sparse-checkout: website
          persist-credentials: false

      - name: Assemble site
        id: assemble
        env:
          RC_TAG: ${{ steps.select.outputs.tag }}
        run: |
          cp -r website _site
          if [ -n "$RC_TAG" ] && ! python3 scripts/build_prerelease_site.py build \
              --site-dir _site --rc-website rc/website --tag "$RC_TAG"; then
            echo "::error::Could not build the $RC_TAG mirror; deploying without it."
            echo "rc_failed=true" >> "$GITHUB_OUTPUT"
            RC_TAG=""
          fi
          if [ -z "$RC_TAG" ]; then
            python3 scripts/build_prerelease_site.py build --site-dir _site
          fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Fail if the release-candidate mirror was dropped
        if: steps.assemble.outputs.rc_failed == 'true'
        run: |
          echo "::error::The stable site deployed, but /prerelease/ is a redirect. See Assemble site."
          exit 1
