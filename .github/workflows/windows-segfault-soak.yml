name: Windows segfault soak

# TEMPORARY. Delete this file, and the branch it lives on, once the
# intermittent 139 on `backend-windows` is settled.
#
# The crash reproduces only on Windows CI, so the fix in
# tests/process_teardown.py cannot be verified anywhere else - and it cannot be
# verified by a single green run either, because the crash is intermittent and
# most runs were always green. What settles it is a RATE, measured against a
# control on the same runner image on the same day.
#
# So every leg runs the real `backend-windows` command N times and tallies how
# many process exits ended in 139, in two arms:
#
#   fast-exit  the shipped behaviour: PIXLSTASH_PYTEST_FAST_EXIT is left unset
#              so the win32 branch in tests/process_teardown.py decides, which
#              is the path that actually ships. Forcing it to "1" would test
#              the override instead.
#   control    PIXLSTASH_PYTEST_FAST_EXIT=0, i.e. CPython's full native
#              teardown - the behaviour that has been crashing.
#
# Read the result as a pair. Control crashing and fast-exit not is the finding.
# Both at zero means the run was too small to see the base rate, NOT that the
# fix works - say so rather than calling it proven.
#
# Push-triggered on purpose: `workflow_dispatch` requires the workflow to be on
# the default branch (main), and this one deliberately never goes there. To run
# it again without a commit, use "Re-run all jobs" on the run page. To change
# the size, edit SOAK_REPEATS below and push.

on:
  push:
    branches:
      - 'soak/**'

permissions:
  contents: read

env:
  # Identical to ci.yml's, so each repeat is the real job and not a lookalike.
  PYTEST_FLAGS: >-
    -q -ra --log-level=INFO --fast-captions --force-cpu
    --durations=0 --durations-min=0

  # Process exits per leg. Cost is roughly 3.5 min of setup plus 10 min per
  # repeat, per leg, and there are 8 legs: 3 repeats is ~35 min of wall clock
  # and ~270 runner-minutes, for 12 exits in each arm. Windows runners bill at
  # 2x, so budget accordingly before raising it.
  SOAK_REPEATS: '3'

jobs:
  # A copy of ci.yml's `warm_models_windows`, for the same reason it exists
  # there: without it all eight legs start cold together and fetch the model
  # set at once, which is the stampede that once earned this repo a 429 from
  # HuggingFace (see .github/actions/model-cache). A soak whose legs fail on a
  # rate limit measures nothing.
  #
  # The cache it saves is scoped to this branch, so deleting the branch takes
  # it with it. `restore-keys` is the unversioned prefix, so a leg can also
  # fall back to the entry on the default branch.
  warm:
    name: warm model cache (Windows)
    runs-on: windows-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: models
        uses: ./.github/actions/model-cache

      - name: Set up Python
        if: steps.models.outputs.hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.models.outputs.hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .[test,dev]

      - name: Download every model the Windows shards load
        if: steps.models.outputs.hit != 'true'
        run: python scripts/prefetch_ci_models.py

      - name: Save the model cache
        if: success() && steps.models.outputs.hit != 'true'
        uses: ./.github/actions/model-cache
        with:
          mode: save
          key: ${{ steps.models.outputs.key }}

  soak:
    name: soak shard ${{ matrix.shard }} (${{ matrix.arm }})
    needs: warm
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        arm: [fast-exit, control]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Same reasoning as ci.yml: armed at interpreter start-up, where pytest's
      # own plugin cannot unregister it. If a control-arm crash ever DOES print
      # a traceback, that rewrites the diagnosis, so keep it on.
      PYTHONFAULTHANDLER: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,dev]

      # Restore-only, exactly as the real job. A miss only costs the first
      # repeat a model download - later repeats reuse the on-disk HF cache, and
      # a miss hits both arms equally, so it cannot bias the comparison.
      - name: Restore the HuggingFace model cache
        uses: ./.github/actions/model-cache

      - name: Soak shard ${{ matrix.shard }} (${{ matrix.arm }})
        shell: bash
        env:
          CI_SHARD: ${{ matrix.shard }}
          ARM: ${{ matrix.arm }}
        run: |
          # The file list is read out of ci.yml rather than copied here. A soak
          # that drifts from the job it is measuring measures nothing, and a
          # second copy of 24 paths is exactly how that drift starts.
          files=$(python - <<'PY'
          import yaml

          workflow = yaml.safe_load(open(".github/workflows/ci.yml"))
          steps = workflow["jobs"]["backend_windows"]["steps"]
          step = next(s for s in steps if "pytest" in (s.get("run") or ""))
          print(
              " ".join(
                  token
                  for token in step["run"].split()
                  if token.startswith("tests/") and token.endswith(".py")
              )
          )
          PY
          )
          count=$(printf '%s\n' $files | wc -l)
          echo "Measuring $count test files, $SOAK_REPEATS times, arm=$ARM"
          test "$count" -gt 10 || { echo "::error::Only $count files parsed out of ci.yml"; exit 1; }

          if [ "$ARM" = "control" ]; then
            export PIXLSTASH_PYTEST_FAST_EXIT=0
          fi

          crashes=0
          other=0
          echo "| arm | shard | run | exit | fast exit fired |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          for run in $(seq 1 "$SOAK_REPEATS"); do
            echo "::group::$ARM shard $CI_SHARD run $run of $SOAK_REPEATS"
            # -e off around the pipeline: a crashing repeat is the measurement,
            # not a reason to abandon the rest of the sample.
            set +e
            python -m pytest $PYTEST_FLAGS --ci-shard "$CI_SHARD/4" $files 2>&1 | tee soak.log
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if grep -q 'without interpreter finalization' soak.log; then
              fired=yes
            else
              fired=no
            fi
            case "$status" in
              0) ;;
              139) crashes=$((crashes + 1)) ;;
              *) other=$((other + 1)) ;;
            esac
            echo "run $run: exit $status, fast exit fired: $fired"
            echo "| $ARM | $CI_SHARD | $run | $status | $fired |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo ""
          echo "=== $ARM shard $CI_SHARD: $crashes/$SOAK_REPEATS exited 139, $other other non-zero ==="
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$ARM shard $CI_SHARD: $crashes/$SOAK_REPEATS exited 139**, $other other non-zero." >> "$GITHUB_STEP_SUMMARY"

          # Never fails on a crash: a crash is the data this job exists to
          # collect, and a red leg would stop the matrix being read as a tally.
          # Only a broken harness fails it.
          if [ "$other" -gt 0 ]; then
            echo "::warning::$other repeat(s) failed for a reason that was not the segfault - check the log before reading the tally."
          fi
