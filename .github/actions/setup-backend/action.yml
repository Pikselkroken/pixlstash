name: Set up the Python backend
description: >-
  Install Python 3.12, restore the pip and HuggingFace model caches, and
  install pixlstash with its test and dev extras against CPU-only torch.
  Shared by every Linux backend job so the matrix shards cannot drift apart —
  in particular so they all compute the same cache keys and therefore all hit
  the same warm caches.

  The model cache is restored, never written, here — see ./model-cache. Exactly
  one job writes it: `warm_models` in ci.yml.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Cache pip packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/pip
        # `pip-cpu-` is a fresh namespace, deliberately. actions/cache only
        # writes on a key miss and restore-keys is a prefix match, so keeping
        # the old `pip-` prefix would restore the 2.85 GB CUDA-fat cache and
        # then re-save those same nvidia wheels forever. Renaming makes the
        # old caches unreachable; the first run is cold, every run after it
        # restores only the CPU wheel set.
        key: pip-cpu-${{ runner.os }}-py3.12-${{ hashFiles('setup.py', 'requirements.txt') }}
        restore-keys: pip-cpu-${{ runner.os }}-py3.12-

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        # CPU-only torch, CI ONLY. Every backend job runs pytest with
        # --force-cpu, so the CUDA payload PyPI's torch drags in
        # (nvidia-*-cu13, triton, ~2.5 GB unpacked) is pure cost here: it was
        # 68 s of the 96 s install, the reason the pip cache was 2.85 GB, and
        # the reason this action had to reclaim runner disk first.
        # download.pytorch.org/whl/cpu is PyTorch's own index and mirrors
        # torch's pure-Python dependencies, so no --extra-index-url is needed
        # and PyPI resolution is untouched for every other package.
        # The specifiers are pyproject.toml's own, so CI resolves exactly the
        # version it resolves today and just takes the +cpu build of it; the
        # project install below then finds the requirement already satisfied
        # and leaves it alone. If the pins ever diverge, the assertion after
        # the install fails the job rather than silently reinstating CUDA.
        # Nothing here changes what a user's `pip install -e .` resolves —
        # that still gets the GPU build.
        pip install --index-url https://download.pytorch.org/whl/cpu \
          "torch~=2.12" "torchvision~=0.27"
        pip install .[test,dev]
        df -h /
        # Fail loudly if a pin change ever lets PyPI's CUDA torch win again,
        # rather than silently paying the install time and disk back. sed, not
        # `grep -q`: under `pipefail` an early-exiting grep SIGPIPEs pip and
        # the guard fires on its own plumbing instead of on the version.
        torch_version="$(pip show torch | sed -n 's/^Version: //p')"
        case "$torch_version" in
          *+cpu) echo "torch $torch_version" ;;
          *)
            echo "::error::torch is $torch_version, not a +cpu build; the CUDA wheels are back."
            exit 1
            ;;
        esac

    - name: Restore the HuggingFace model cache
      uses: ./.github/actions/model-cache
