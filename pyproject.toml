[project]
name = "pixlstash"
version = "1.11.0"
description = "Self-hosted picture library with AI tagging, semantic search, and a clean web UI"
readme = "README.md"
license = "GPL-3.0-only AND MIT"
license-files = [
  "pixlstash/LICENSE",
  "frontend/LICENSE",
]
authors = [
    { name = "Gaute Lindkvist", email="lindkvis@gmail.com" }
]
keywords = [
    "image library",
    "AI tagging",
    "semantic search",
    "photo management",
    "self-hosted",
    "comfyui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "open_clip_torch>=3.3.0",
    # Hard floor: route_inventory.py needs fastapi.routing.iter_route_contexts,
    # added in 0.138.0. Below that the server fails to import at startup.
    "fastapi>=0.138.0",
    "uvicorn>=0.41.0",
    "uvicorn[standard]>=0.41.0",
    "numpy>=2.4.3",
    "pillow>=12.3.0",
    "opencv-python>=4.13.0.92",
    "scipy>=1.17.1",
    "platformdirs>=4.9.4",
    # The OS trash, for the shelf's delete verb. Pure Python, no dependencies of
    # its own, and the only portable way to reach the Recycle Bin, the macOS
    # Trash and the freedesktop.org one — none of which is a directory you can
    # correctly write to by hand.
    "send2trash>=2.1.0",
    "tomli>=2.4.0",
    "colorlog>=6.10.1",
    "python-multipart>=0.0.22",
    "onnxruntime>=1.24.3",
    "requests>=2.32.5",
    "accelerate~=1.13",
    "transformers~=5.12",
    "bitsandbytes>=0.44.0",
    "torch~=2.12",
    "torchvision~=0.27",
    "insightface>=0.7.3",
    "rapidfuzz>=3.14.3",
    "tqdm>=4.67.3",
    "sentence_transformers~=5.2",
    "pillow-heif>=1.3.0",
    "sqlmodel>=0.0.37",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt>=3.2.2,<4.0.0",
    "nvidia-ml-py>=13.590.48",
    "piexif>=1.1.3",
    "watchdog>=4.0.0",
    "click~=8.1.8",
    "zstandard>=0.23.0",
]

[project.urls]
Homepage = "https://pikselkroken.github.io/pixlstash"
Repository = "https://github.com/pikselkroken/pixlstash"
"Bug Tracker" = "https://github.com/pikselkroken/pixlstash/issues"
Changelog = "https://github.com/pikselkroken/pixlstash/releases"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    # Local parallelism: `-n auto` runs the suite in a fraction of the wall
    # clock. NOT used by CI, which parallelises across runners instead — see
    # the `backend` job in .github/workflows/ci.yml for why (native ML
    # teardown aborts under multiple workers).
    "pytest-xdist",
    "psutil",
    # Required by starlette's TestClient, which the suite uses everywhere.
    # Not a runtime need: nothing under pixlstash/ imports httpx.
    "httpx>=0.28.1"
]
dev = [
    # Pinned < 0.16: ruff 0.16 greatly expanded its default rule set (UP045,
    # BLE001, I001, ...), flagging thousands of pre-existing lines and the
    # deliberate logged `except Exception` handlers. Add an explicit [tool.ruff]
    # config that locks the intended rules before bumping this.
    "ruff<0.16"
]

[project.scripts]
pixlstash-server = "pixlstash.app:main"
pixlstash-cli = "pixlstash.cli:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pixlstash*"]

[tool.setuptools.package-data]
pixlstash = [
    "alembic.ini",
    "frontend/dist/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "image_plugins/built-in/*.py",
    "data/anchors/*.npy",
    "data/comfyui-workflows/built-in/*.json",
    "data/scalar-assets/*",
]
